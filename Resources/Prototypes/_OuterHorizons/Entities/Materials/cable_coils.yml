- type: entity
  id: OH14_CableCoilBasic
  abstract: true
  parent: OH14_BaseItem
  description: Небольшой моток кабеля. Интересно было бы сделать из этого какоето украшение, пхахахв блять. Пометьте как TODO.
  components:
  - type: Tag
    tags:
    - CableCoil
    - OH14_Tools
  - type: Stack
    count: 16
    stackType: Cable
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/cable_coils.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/cable_coils.rsi
    size: Small
  - type: CablePlacer
  - type: Clickable
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 2.25
  - type: PhysicalComposition
    materialComposition:
      Steel: 15
  - type: GuideHelp
    guides:
    - VoltageNetworks
    - Power
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]

# Кабеля

- type: entity
  id: OH14_CableCoilHV
  parent: OH14_CableCoilBasic
  name: моток ВВ кабелей
  suffix: Full
  components:
  - type: Stack
    stackType: OH14_CableCoilHV
    baseLayer: base
    layerStates:
    - coilhv-10
    - coilhv-20
    - coilhv-30
  - type: Sprite
    state: coilhv-30
    layers:
    - state: coilhv-30
      map: ["base"]
  - type: Item
    heldPrefix: coilhv
  - type: CablePlacer
    cablePrototypeID: OH14_CableHV
    blockingWireType: HighVoltage
  - type: Appearance
  - type: Extractable
    grindableSolutionName: hvcable
  - type: SolutionContainerManager
    solutions:
      hvcable:
        reagents:
        - ReagentId: Iron
          Quantity: 3
        - ReagentId: Copper
          Quantity: 2
        - ReagentId: Carbon #steel-reinforced
          Quantity: 1

- type: entity
