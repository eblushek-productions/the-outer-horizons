# Core logic shared between regular and wall-mount substation
- type: entity
  abstract: true
  id: OH14_CoreSubstation
  categories: [ ForkFiltered ]
  components:
  # Core power behavior
  - type: Battery
    # Very important:
    # Disable networking to prevent the battery getting continuously dirtied every tick as it interacts with the power network.
    # This can not be done by changing the charge rate as the power supply ramps up over time.
    # This disables prediction for this battery.
    netsync: false
  - type: ExaminableBattery
  - type: NodeContainer
    examinable: true
    nodes:
      input:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      output:
        !type:CableDeviceNode
        nodeGroupID: MVPower
  - type: BatteryCharger
    voltage: High
  - type: BatteryDischarger
    voltage: Medium
  - type: PowerNetworkBattery
    maxSupply: 150000
    maxChargeRate: 5000
    supplyRampTolerance: 5000
    supplyRampRate: 1000
  - type: StationInfiniteBatteryTarget
  # Interface
  - type: BatteryInterface
    minChargeRate: 5000
    maxChargeRate: 150000
    minSupply: 5000
    maxSupply: 150000
  - type: UserInterface
    interfaces:
      enum.BatteryUiKey.Key:
        type: BatteryBoundUserInterface
  - type: ActivatableUI
    key: enum.BatteryUiKey.Key
  - type: PowerMonitoringDevice
    group: Substation
    sourceNode: input
    loadNode: output
    collectionName: substation
  # Damage
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: PacifismDangerousAttack
  # Guidebook
  - type: GuideHelp
    guides:
    - VoltageNetworks
    - Power
  # Ambient sound
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -5
    sound:
      path: /Audio/Ambience/Objects/buzzing.ogg

# Base substation
- type: entity
  abstract: true
  id: OH14_BaseSubstation
  parent: [ OH14_CoreSubstation, BaseMachine ]
  name: подстанция
  description: Снижает напряжение поступающего электричества для ЛКП.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite # TODO: add sprite for maintenance panel open
    sprite: _OuterHorizons/Structures/Power/substation.rsi
    noRot: true
    layers:
    - state: substation
    # - state: "panel_open"
    #   map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
    #   visible: false
    - state: "panel_closed"
      # map: [ "enum.WiresVisualLayers.MaintenancePanelClosed" ]
      visible: true
    - state: screen
      shader: unshaded
  - type: WiresPanel
    screwdriverOpenSound: /Audio/_OuterHorizons/Machines/panel_open.ogg
    screwdriverCloseSound: /Audio/_OuterHorizons/Machines/panel_close.ogg
  # - type: WiresVisuals
  - type: Battery
    maxCharge: 2500000
    startingCharge: 0
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#34e06d" # Corvax-Resprite
    castShadows: false
  - type: PowerMonitoringDevice
    sprite: _OuterHorizons/Structures/Power/substation.rsi
    state: substation_static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
      - !type:ExplodeBehavior
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 3
      - !type:SpawnGasBehavior
        gasMixture:
          volume: 1000
          moles:
            CarbonDioxide: 340.5701689 # carbon dioxide
          temperature: 373.15
  - type: Explosive
    explosionType: Default
    maxIntensity: 100
    intensitySlope: 2
    totalIntensity: 200
  # - type: Machine
  #   board: SubstationMachineCircuitboard
  - type: AmbientSound
    range: 5
  - type: Electrified
    onHandInteract: false
    onInteractUsing: false
    onBump: false
    requirePower: true
    highVoltageNode: input
    mediumVoltageNode: output
  - type: Construction
    graph: OH14_SubstationFrame
    node: OH14_Substation

# Compact Wall Substation Base
- type: entity
  id: OH14_BaseSubstationWall
  parent: OH14_CoreSubstation
  categories: [ HideSpawnMenu ]
  name: настенная подстанция
  description: Подстанция, уменьшенная под маленькое пространство шаттлов.
  placement:
    mode: SnapgridCenter
  components:
  - type: AmbientSound
    range: 2
  - type: PointLight
    radius: 1.5
    energy: 1
    color: "#34e06d" # Corvax-Resprite
    netsync: false
    castShadows: false
    offset: 0, -0.2
  - type: Clickable
  - type: ContainerFill
    containers:
      board: [ WallmountSubstationElectronics ]
  - type: ContainerContainer
    containers:
      board: !type:Container
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Transform
    anchored: true
  - type: Sprite # TODO: add sprite for maintenance panel open
    drawdepth: WallMountedItems
    sprite: _OuterHorizons/Structures/Power/substation.rsi
    layers:
    - state: substation_wall
    - state: wall_panel_closed
    - state: screen_wall
      shader: unshaded
  - type: Battery
    maxCharge: 2000000
    startingCharge: 0
  - type: PowerMonitoringDevice
    sprite: _OuterHorizons/Structures/Power/substation.rsi
    state: substation_wall_static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:ExplodeBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
  - type: Construction
    graph: OH14_SubstationWallmount
    node: OH14_SubstationWallmount
  - type: Explosive
    explosionType: Default
    maxIntensity: 50
    intensitySlope: 2
    totalIntensity: 100
  - type: WallMount

# Substations in use

- type: entity
  parent: OH14_BaseSubstation
  id: OH14_Substation
  suffix: Basic, 2.5MJ
  components:
  - type: Battery
    maxCharge: 2500000
    startingCharge: 2500000

- type: entity
  parent: OH14_BaseSubstation
  id: OH14_SubstationEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0

- type: entity
  parent: OH14_BaseSubstationWall
  id: OH14_SubstationWall
  suffix: Basic, 2MJ
  components:
  - type: Battery
    maxCharge: 2000000
    startingCharge: 2000000
  - type: ContainerFill
    containers:
      board: [ WallmountSubstationElectronics ]
      manipulator: [ MicroManipulatorStockPart ]
      powercell: [ PowerCellSmall ]
  - type: ContainerContainer
    containers:
      board: !type:Container
      manipulator: !type:Container
      powercell: !type:Container
