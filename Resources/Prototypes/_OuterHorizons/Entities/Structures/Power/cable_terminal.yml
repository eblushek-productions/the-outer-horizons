- type: entity
  id: OH14_CableTerminal
  categories: [ ForkFiltered ]
  name: кабельный терминал
  description: Позволяет направить поток энергии через аккамулятор. Подключать красной стороной.
  placement:
    mode: SnapgridCenter
  components:
    - type: Sprite
      sprite: _OuterHorizons/Structures/Power/cable_terminal.rsi
      state: term
      drawdepth: BelowFloor
    - type: Clickable
    - type: InteractionOutline
    - type: CollideOnAnchor
    - type: Transform
      anchored: true
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 25
          behaviors:
            - !type:DoActsBehavior
              acts: ["Destruction"]
    - type: Visibility
      layer: 1
    - type: Appearance
    - type: SubFloorHide
      blockAmbience: false
      blockInteractions: false
    - type: Construction
      graph: OH14_CableTerminal
      node: cable_terminal
    - type: NodeContainer
      nodes:
        # Just define nodes for both MV and HV. One will end up unused in 99% of cases
        # but it means one cable terminal type.
        powerHV:
          !type:CableTerminalNode
          nodeGroupID: HVPower
        powerMV:
          !type:CableTerminalNode
          nodeGroupID: MVPower
