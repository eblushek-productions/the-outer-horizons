# Base SMES
- type: entity
  abstract: true
  id: OH14_BasicBatteryArray
  parent: [ OH14_BaseStructure, BaseMachine ]
  name: массив аккамуляторов
  description: 4 высоковольтных аккамулятора сплетенных в одну сеть. Ваш источник бесперебойного питания на этот час.
  placement:
    mode: SnapgridCenter
  components:
    - type: AmbientSound
      volume: -7
      range: 3
      sound:
        path: /Audio/Ambience/Objects/buzzing.ogg
    - type: Sprite
      sprite: _OuterHorizons/Structures/Power/smes.rsi
      snapCardinals: true
      layers:
        - state: smes
        - map: ["enum.SmesVisualLayers.Charge"]
          state: "smes-og1" # -og0 does not exist
          shader: unshaded
          visible: false
        - map: ["enum.SmesVisualLayers.Input"]
          state: "smes-oc0"
          shader: unshaded
        - map: ["enum.SmesVisualLayers.Output"]
          state: "smes-op1"
          shader: unshaded
        # - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
        #   state: smes-open
    - type: Smes
    - type: Appearance
    - type: Battery
      netsync: false
      startingCharge: 0
      maxCharge: 8000000
    - type: ExaminableBattery
    - type: NodeContainer
      examinable: true
      nodes:
        input:
          !type:CableTerminalPortNode
          nodeGroupID: HVPower
        output:
          !type:CableDeviceNode
          nodeGroupID: HVPower
    - type: PowerMonitoringDevice
      group: SMES
      sourceNode: input
      loadNode: output
      collectionName: smes
      sprite: Structures/Power/smes.rsi
      state: static
    - type: BatteryDischarger
      voltage: High
      node: output
    - type: BatteryCharger
      voltage: High
      node: input
    - type: PowerNetworkBattery
      maxSupply: 150000
      maxChargeRate: 5000
      supplyRampTolerance: 5000
      supplyRampRate: 1000
    - type: PointLight
      radius: 1.2
      energy: 3.0
      color: "#c9c042"
      castShadows: false
    - type: StationInfiniteBatteryTarget
    - type: Electrified
      onHandInteract: false
      onInteractUsing: false
      onBump: false
      requirePower: true
      highVoltageNode: input
      mediumVoltageNode: output
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: StructuralMetallicStrong
    - type: BatterySensor
    - type: DeviceNetwork
      deviceNetId: AtmosDevices
      receiveFrequencyId: AtmosMonitor
      transmitFrequencyId: AtmosMonitor
      prefix: device-address-prefix-smes
      sendBroadcastAttemptEvent: true
      examinableAddress: true
    - type: WiredNetworkConnection
    - type: GuideHelp
      guides:
      - PowerStorage
      - VoltageNetworks
      - Power
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 200
        behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:DoActsBehavior
          acts: ["Destruction"]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalGlassBreak
        - !type:ExplodeBehavior
        - !type:SpawnEntitiesBehavior
          spawn:
            OH14_SheetMaterials1:
              min: 1
              max: 3
        - !type:SpawnGasBehavior
          gasMixture:
            volume: 1000
            moles:
              CarbonDioxide: 340.5701689 # carbon dioxide
            temperature: 373.15
    - type: Explosive
      explosionType: Default
      maxIntensity: 100
      intensitySlope: 2
      totalIntensity: 200
    # Interface
    - type: BatteryInterface
      minChargeRate: 5000
      maxChargeRate: 150000
      minSupply: 5000
      maxSupply: 150000
    - type: UserInterface
      interfaces:
        enum.BatteryUiKey.Key:
          type: BatteryBoundUserInterface
    - type: ActivatableUI
      key: enum.BatteryUiKey.Key
    - type: ContainerFill
      containers:
        powercell: [ OH14_PowerCellBigEmpty ]
    - type: ContainerContainer
      containers:
        powercell: !type:Container
    - type: Construction
      graph: OH14_BatteryArray
      node: OH14_BatteryArray

# SMES' in use

- type: entity
  parent: OH14_BasicBatteryArray
  id: OH14_BatteryArray
  suffix: Basic, 8MJ
  components:
  - type: Battery
    maxCharge: 8000000
    startingCharge: 8000000

- type: entity
  parent: OH14_BasicBatteryArray
  id: OH14_BatteryArrayEmpty
  suffix: Empty
  components:
  - type: Battery
    startingCharge: 0
