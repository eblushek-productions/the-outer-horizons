- type: entity
  abstract: true
  id: OH14_BasicGenerator
  categories: [ ForkFiltered ]
  parent: OH14_BaseStructure
  components:
    # Basic properties
    - type: Transform
      anchored: true
    - type: Anchorable
    # - type: Physics
    #   bodyType: Dynamic
    - type: InteractionOutline
    - type: Explosive
      explosionType: Default
      # Same as AME, but numbers still picked from a hat.
      maxIntensity: 100
      intensitySlope: 2
      totalIntensity: 200
    - type: StaticPrice
      price: 500
    - type: AmbientSound
      range: 8
      volume: -6
      sound:
        path: /Audio/_OuterHorizons/Machines/reactor_working.ogg
      enabled: false
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.40,-0.40,0.40,0.40"
          # Despite the heavy weight, it has wheels, so it's still fairly portable.
          density: 600
          mask:
            - MachineMask
          layer:
            - MachineLayer
    # Visuals
    - type: Appearance
    # Construction, interaction
    # - type: WiresPanel
    #   screwdriverOpenSound: /Audio/_OuterHorizons/Machines/panel_open.ogg
    #   screwdriverCloseSound: /Audio/_OuterHorizons/Machines/panel_close.ogg
    - type: UserInterface
      interfaces:
        enum.GeneratorComponentUiKey.Key:
          type: PortableGeneratorBoundUserInterface
    - type: ActivatableUI
      key: enum.GeneratorComponentUiKey.Key
    - type: Electrified
      onHandInteract: false
      onInteractUsing: false
      onBump: false
      requirePower: true
      highVoltageNode: output
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: Metallic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:SpawnEntitiesBehavior
              spawn:
                OH14_SheetMaterials1:
                  min: 1
                  max: 2
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            # - !type:ChangeConstructionNodeBehavior
            #   node: machineFrame
            - !type:DoActsBehavior
              acts: ["Destruction"]
            - !type:ExplodeBehavior
    - type: GuideHelp
      guides:
      - PortableGenerator
      - Power
    # Core functionality
    - type: PortableGenerator
      startSoundEmpty: /Audio/_OuterHorizons/Machines/reactor_on_fail.ogg
      startSound: /Audio/_OuterHorizons/Machines/reactor_on.ogg
    - type: FuelGenerator
    - type: PowerSupplier
      supplyRate: 3000
      supplyRampRate: 500
      supplyRampTolerance: 500
      enabled: false
    - type: DeviceLinkSink
      ports:
      - On
      - Off
      - Toggle
    - type: GeneratorSignalControl
    - type: DeviceNetwork
      deviceNetId: Wireless
      receiveFrequencyId: BasicDevice
    - type: WirelessNetworkConnection
      range: 200

- type: entity
  abstract: true
  parent: OH14_BasicGenerator
  id: OH14_BasicGeneratorSwitchable
  components:
  - type: PowerSwitchable
    examineText: power-switchable-generator-examine
    switchText: power-switchable-generator-switched
    cables:
    - voltage: HV
      node: output_hv
    - voltage: MV
      node: output_mv
  - type: UseDelay
    delay: 1
  - type: NodeContainer
    examinable: true
    nodes:
      output_hv:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      output_mv:
        !type:CableDeviceNode
        nodeGroupID: MVPower
        enabled: false
