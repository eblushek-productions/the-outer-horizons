- type: entity
  name: ТЭТ Генератор
  description: Термоэлектрический Топлевный Генератор. В отличие от своих твердотопливных аналогов, потребляет горючее в литрах.
  parent: [ OH14_BasicGeneratorSwitchable, OH14_PlumbingMachineBase ]
  id: OH14_GeneratorTEF
  suffix: Топливо, 20 kW
  components:
    - type: NodeContainer
      examinable: true
      nodes:
        output_hv:
          !type:CableDeviceNode
          nodeGroupID: HVPower
        output_mv:
          !type:CableDeviceNode
          nodeGroupID: MVPower
          enabled: false
        inlet:
          !type:PlumbingNode
          nodeGroupID: Plumbing
          pipeDirection: North
    - type: PlumbingDevice
      updateInterval: 2
    - type: PlumbingInlet
      solutionName: tank
    - type: Construction
      graph: OH14_GeneratorTEF
      node: OH14_GeneratorTEF
    - type: AmbientSound
      range: 4
      volume: -5
      sound:
        path: /Audio/Ambience/Objects/engine_hum.ogg
      enabled: false
    - type: Sprite
      sprite: _OuterHorizons/Structures/Power/fuel_generator.rsi
      noRot: true
      layers:
        - state: icon
        - state: on_unshaded
          map: [ "enum.GeneratorVisualLayers.Unlit" ]
          shader: unshaded
          visible: false
    - type: GenericVisualizer
      visuals:
        enum.GeneratorVisuals.Running:
          enum.GeneratorVisualLayers.Unlit:
            True: { visible: true }
            False: { visible: false }
    - type: FuelGenerator
      targetPower: 5000
      minTargetPower: 4000
      optimalPower: 20000
      maxTargetPower: 20000
      # 7.5 minutes at full tank.
      optimalBurnRate: 0.11111111
      # Shallow curve that allows you to just barely eek out 12 minutes at lowest.
      fuelEfficiencyConstant: 0.3
    - type: ChemicalFuelGeneratorAdapter
      solution: tank
      reagents:
        Hydrogen: 1 # TODO, доработать заглушку в виде водорода
    - type: SolutionContainerManager
      solutions:
        tank:
          maxVol: 100
    - type: RefillableSolution
      solution: tank
    - type: PortableGenerator
      startSoundEmpty: { collection: GeneratorTugEmpty }
      startSound: { collection: GeneratorTug }
      startChance: 1
    - type: PowerMonitoringDevice
      group: Generator
      loadNodes:
        - output_hv
        - output_mv
    - type: PowerSupplier
      supplyRampTolerance: 2000
    - type: GeneratorExhaustGas
      gasType: CarbonDioxide
      # Full tank is 25 moles of gas
      moleRatio: 0.5
    - type: Explosive
      explosionType: Default
      tileBreakScale: 0
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:SpillBehavior
              solution: tank
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
            - !type:DoActsBehavior
              acts: ["Destruction"]
        - trigger:
            !type:DamageTypeTrigger
            damageType: Piercing
            damage: 75
          behaviors:
            - !type:SolutionExplosionBehavior
              solution: tank
