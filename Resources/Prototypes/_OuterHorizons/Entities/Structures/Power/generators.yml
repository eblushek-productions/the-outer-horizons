- type: entity
  id: OH14_DebugGenerator
  name: генератор
  categories: [ ForkFiltered ]
  parent: BaseGenerator
  suffix: Генератор, DEBUG
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Power/debug_generator.rsi
    state: icon
  - type: PowerSupplier
    supplyRate: 300000
    supplyRampRate: 50000
    supplyRampTolerance: 500

