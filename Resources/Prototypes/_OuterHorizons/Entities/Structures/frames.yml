# =============================================================================
# Подстанции
# =============================================================================

- type: entity
  id: OH14_SubstationFrame
  parent: OH14_FrameBasic
  name: каркас подстанции
  components:
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          subFrame: { state: substation_frame }
          subFrame2: { state: substation }
  - type: Sprite
    sprite: _OuterHorizons/Structures/Power/substation.rsi
    layers:
    - state: substation_frame
      # map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Construction
    graph: OH14_SubstationFrame
    node: subFrame

- type: entity
  id: OH14_SubstationWallFrame
  categories: [ ForkFiltered ]
  name: каркас настенной подстанции
  description: Каркас подстанции, да.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
  - type: Transform
    anchored: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          subFrame: { state: substation_wall_frame }
          subFrame2: { state: substation_wall }
  - type: Sprite
    drawdepth: WallMountedItems
    sprite: _OuterHorizons/Structures/Power/substation.rsi
    layers:
    - state: substation_wall_frame
  - type: Construction
    graph: OH14_SubstationWallmount
    node: subFrame
  - type: WallMount

