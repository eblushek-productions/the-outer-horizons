- type: entity
  id: OH14_FrameBasic
  parent: OH14_BaseStructureDynamic
  abstract: true
  name: каркас
  description: Каркас вашего оборудования, ветхий и не надежный.
  components:
  - type: Transform
    anchored: false
    noRot: true
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          frame1: { state: frame0 }
          frame2: { state: frame1 }
          frame3: { state: frame2 }
  - type: Appearance
  - type: Sprite
    noRot: true
    sprite: _OuterHorizons/Structures/Machines/autolathe.rsi
    state: frame0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetIron1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable

