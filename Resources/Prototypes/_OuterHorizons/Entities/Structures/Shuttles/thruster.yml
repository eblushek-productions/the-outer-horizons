# ------------------------ Базик
- type: entity
  id: OH14_BaseThruster
  suffix: "Двигатель"
  parent: OH14_BaseStructure
  name: ракетный двигатель
  abstract: true
  components:
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 800
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: Anchorable
    delay: 5
  - type: AmbientSound
    enabled: false
    range: 10
    volume: -1
    sound:
      path: /Audio/_OuterHorizons/Machines/rokit.ogg
  - type: Transform
    anchored: true
  - type: Physics
    bodyType: Static
  - type: Rotatable
    # rotateWhileAnchored: true
  - type: Thruster
    canToggle: false
    damage:
      types:
        Heat: 40
  - type: InteractionOutline
  - type: Sprite
  - type: Appearance
  - type: ThrusterVisuals
  - type: ExtensionCableReceiver
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100  # Considering we need a lot of thrusters didn't want to make an individual one too tanky
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:SpawnEntitiesBehavior
          spawn:
            OH14_SheetMaterials1:
              min: 1
              max: 2
      - !type:SpawnEntitiesBehavior
          spawn:
            OH14_SheetComponents1:
              min: 1
              max: 2
  - type: StaticPrice
    price: 300
  - type: GuideHelp
    guides:
    - ShuttleCraft
  - type: Temperature
    atmosTemperatureTransferEfficiency: 0.005
  - type: AtmosExposed
  - type: ContainerTemperature
  - type: StructureTemperatureThreshold
    thresholds:
      - temperature: 550
        onThresholdExit:
          !type:PressureThrusterOnTemperatureLow
      - temperature: 600
        onThreshold:
          !type:PressureThrusterOnTemperatureHigh
  - type: RedHeat
    spriteData:
    - temperature: 300
      spriteLayer: heat1
    - temperature: 450
      spriteLayer: heat2
    - temperature: 550
      spriteLayer: heat3
  placement:
    mode: SnapgridCenter

- type: entity
  id: OH14_BaseThrusterPressure
  categories: [ ForkFiltered ]
  parent: OH14_BaseThruster
  name: ракетный двигатель
  abstract: true
  components:
  - type: AtmosDevice
    joinSystem: true
  - type: PointLight
    rotation: 180
    autoRot: true
    radius: 8
    energy: 8
    color: "#4677ff"
    offset: "0, 0.2"
    # castShadows: true
    enabled: false
    mask: /Textures/_OuterHorizons/Effects/LightMasks/cone_alt.png
  - type: PressureThruster
    inletName: inlet
  - type: NodeContainer
    nodes:
      inlet:
        !type:PipeNode
        nodeGroupID: Pipe
        pipeDirection: South
        volume: 50

# ------------------------ Разгонные двигла

- type: entity
  id: OH14_ThrusterPressureBlue
  name: продвинутый ракетный двигатель
  description: Продвинутый ракетный двигатель с двумя сведенными соплами, потребляющий топливо для своей работы. За ним имеется порт для трубы.
  parent: OH14_BaseThrusterPressure
  components:
  - type: Thruster
    thrust: 250
  - type: PressureThruster
    inletName: inlet
    pressureСonsumption: 25
  - type: Sprite
    sprite: _OuterHorizons/Structures/Shuttles/b_thruster.rsi
    layers:
    - state: pipe
      offset: "0, -0.1"
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
    - state: heat1
      map: [ "heat1" ]
      visible: false
      shader: unshaded
    - state: heat2
      map: [ "heat2" ]
      visible: false
      shader: unshaded
    - state: heat3
      map: [ "heat3" ]
      visible: false
      shader: unshaded

