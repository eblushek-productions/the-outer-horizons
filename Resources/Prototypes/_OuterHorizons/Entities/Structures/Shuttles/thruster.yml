# ------------------------ RCS

- type: entity
  id: OH14_ThrusterPressureRCS
  suffix: СТАРОЕ
  name: ракетное РСУ
  description: Старый, но вполне рабочий RCS, потребляющий топливо для своей работы. За ним имеется порт для трубы.
  parent: OH14_BaseThrusterPressure
  components:
  - type: Machine
    board: ThrusterMachineCircuitboard
  - type: Thruster
    thrust: 60
  - type: PressureThruster
    moleMaxOutletLimit: 100
    moleMinOutletLimit: 30
    accelerationEfficiency: 1.0
  - type: PointLight
    color: "#eca664"
  - type: Sprite
    sprite: _OuterHorizons/Structures/Shuttles/OldThrusters/rcs.rsi
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - sprite: _OuterHorizons/Structures/Shuttles/burn.rsi
      state: rcs
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
      color: "#e5e3e4"
      offset: "0, 1"

