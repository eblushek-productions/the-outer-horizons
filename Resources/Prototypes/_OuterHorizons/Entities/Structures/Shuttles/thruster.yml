# ------------------------ Гироскоп

- type: entity
  id: OH14_Gyroscope
  categories: [ ForkFiltered ]
  parent: OH14_BaseThruster
  name: гиродин
  description: 2 вращающихся механизма, иронично вращающих вас.
  components:
  - type: AmbientSound
    enabled: false
    range: 5
    volume: -8
    sound:
      path: /Audio/_OuterHorizons/Machines/rokit.ogg
  - type: Construction
    graph: OH14_Gyroscope
    node: OH14_Gyroscope
  - type: Sprite
    # Listen I'm not the biggest fan of the sprite but it was the most appropriate thing I could find.
    sprite: _OuterHorizons/Structures/Shuttles/gyroscope.rsi
    snapCardinals: true
    layers:
    - state: base
      map: ["enum.ThrusterVisualLayers.Base"]
    - state: thrust
      map: ["enum.ThrusterVisualLayers.ThrustOn"]
      shader: unshaded
      visible: false
    - state: thrust_burn
      map: [ "enum.ThrusterVisualLayers.Thrusting" ]
      visible: false
    - state: thrust_burn_unshaded
      map: ["enum.ThrusterVisualLayers.ThrustingUnshaded"]
      shader: unshaded
      visible: false
  - type: Thruster
    thrusterType: Angular
    requireSpace: false
    thrust: 250
