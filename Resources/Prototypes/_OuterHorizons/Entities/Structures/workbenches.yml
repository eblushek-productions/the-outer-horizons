- type: entity
  parent: OH14_BaseStructure
  id: OH14_BaseWorkbench
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Sprite
    snapCardinals: true
    sprite: _OuterHorizons/Structures/workbench.rsi
    state: icon
  - type: Icon
    sprite: _OuterHorizons/Structures/workbench.rsi
    state: icon
  - type: ActivatableUI
    key: enum.CEWorkbenchUiKey.Key
    requiresComplex: true
    singleUser: true
  - type: Climbable
  - type: Clickable
  - type: CEWorkbench
    craftSpeed: 1
  - type: InteractionOutline
  - type: UserInterface
    interfaces:
      enum.CEWorkbenchUiKey.Key:
        type: CEWorkbenchBoundUserInterface
  # - type: Damageable
  #   damageContainer: Inorganic
  #   damageModifierSet: CEWood
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: WoodDestroy
      # - !type:SpawnEntitiesBehavior
      #   spawn:
      #     CEWoodenPlanks1:
      #       min: 1
      #       max: 2
  - type: PlaceableSurface
  - type: CEWorkbenchPlaceableProvider
  - type: ItemPlacer
    maxEntities: 0
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask: # tables should collide with other tables
        - TableMask
        layer:
        - TableLayer
      fix2:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        mask:
        - TabletopMachineMask
        layer:
        - Impassable
        - MidImpassable
        - LowImpassable
        hard: false

- type: entity
  parent: OH14_BaseWorkbench
  id: OH14_Workbench
  name: верстак
  description: Значительно упрощает и позволяет создание ручных приколов.
  components:
  - type: Sprite
    state: icon
  - type: Icon
    state: icon
  # - type: FootstepModifier
  #   footstepSoundCollection:
  #     collection: FootstepWood
  #- type: FireVisuals
  #  sprite: _CE/Effects/fire.rsi
  #  normalState: full
  # - type: Construction
  #   graph: CEWorkbench
  #   node: CEWorkbench
  - type: CEWorkbench
    recipeTags:
    - CERecipeWorkbench
