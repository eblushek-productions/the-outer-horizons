  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: pipe_output
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: output
    inletNames:
