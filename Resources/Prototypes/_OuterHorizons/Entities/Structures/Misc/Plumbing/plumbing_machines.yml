# =============================================================================
# Plumbing Reactor - accumulates reagents and triggers reactions
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingReactor
  name: реакционная камера
  description: Буфер внутри которого реагенты безопасно (нет) смешиваются для реакции.
  components:
  - type: Construction
    graph: OH14_PlumbingReactor
    node: OH14_PlumbingReactor
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -5
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: ActivatableUIRequiresPower
  - type: PointLight
    radius: 2
    energy: 5.0
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.5" # shine from the top, not bottom of the computer
    castShadows: false
    color: "#B79036"
  - type: LitOnPowered
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: reaction_chamber
      map: [ "enum.PlumbingVisualLayers.Base" ]
    - state: reaction_chamber_on
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Base:
          True: { state: reaction_chamber }
          False: { state: reaction_chamber }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingReactor
    bufferSolutionName: buffer
    outputSolutionName: output
    inletName: inlet
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: output
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 100
        canReact: false  # Reactions triggered manually when targets met
      output:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: UserInterface
    interfaces:
      enum.PlumbingReactorUiKey.Key:
        type: PlumbingReactorBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingReactorUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 750
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:SpillBehavior
        solution: output
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150

# =============================================================================
# Plumbing Smart Dispenser - stores reagents from the network, fills labeled jugs
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingSmartDispenser
  name: химический дозатор
  description: OH14_PlumbingSmartDispenser
  components:
  - type: Sprite
    sprite: Structures/Machines/smartfridge.rsi
    layers:
    - state: smartfridge
      map: ["enum.StorageVisualLayers.Base"]
    - state: smartfridge_door
      map: ["enum.StorageVisualLayers.Door"]
      shader: unshaded
  - type: PointLight
    radius: 1.2
    energy: 3.0
    color: "#9dc5c9"
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: fridge
    inletNames:
    - inletNorth
    - inletEast
    - inletSouth
    - inletWest
  - type: PlumbingSmartDispenser
    solutionName: fridge
    maxPerReagent: 200
  - type: SolutionContainerManager
    solutions:
      fridge:
        maxVol: 50000
        canReact: false
  - type: ExaminableSolution
    solution: fridge
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletSouth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: UserInterface
    interfaces:
      enum.PlumbingSmartDispenserUiKey.Key:
        type: PlumbingSmartDispenserBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingSmartDispenserUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:SpillBehavior
        solution: fridge
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 200

# =============================================================================
# Plumbing Pill Press - automatically creates pills or patches from reagents
# =============================================================================
- type: entity
  parent: [ OH14_PlumbingMachineBase, BaseMachinePowered ]
  id: OH14_PlumbingPillPress
  name: химический пресс
  description: Превращает ваши лекарства в колеса.
  components:
  - type: Construction
    graph: OH14_PlumbingPillPress
    node: OH14_PlumbingPillPress
  - type: EmitSoundOnUIOpen
    sound:
      collection: Keyboard
      params:
        volume: -5
        variation: 0.10
        pitch: 1.10  # low pitch keyboard sounds feel kinda weird
    blacklist:
      tags:
      - NoConsoleSound
  - type: ActivatableUIRequiresPower
  - type: PointLight
    radius: 2
    energy: 5.0
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.5" # shine from the top, not bottom of the computer
    castShadows: false
    color: "#B79036"
  - type: LitOnPowered
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: pill_press_off
      map: [ "enum.PlumbingVisualLayers.Base" ]
    - state: pill_press
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
  - type: GenericVisualizer
    visuals:
      enum.PowerDeviceVisuals.Powered:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true, shader: unshaded }
          False: { visible: false }
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Base:
          True: { state: pill_press_off }
          False: { state: pill_press_off }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingPillPress
    bufferSolutionName: buffer
    dosage: 10
  - type: PlumbingConnectorAppearance
    # offset: 0.09375
    mixingInletNames:
    - mixingInletEast
    - mixingInletWest
  - type: PlumbingInlet
    solutionName: buffer
    inletNames:
    - inlet
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 20
        canReact: false
      stagingEast:
        maxVol: 20
        canReact: false
      stagingWest:
        maxVol: 20
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      mixingInletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      mixingInletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
  - type: UserInterface
    interfaces:
      enum.PlumbingPillPressUiKey.Key:
        type: PlumbingPillPressBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingPillPressUiKey.Key
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 150
# =============================================================================
# Plumbing Filter - separates specific reagents into two outputs
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingFilter
  name: водопроводный фильтр
  description: Вход через красный порт, выход через желтые.
  components:
  - type: Construction
    graph: OH14_PlumbingFilter
    node: OH14_PlumbingFilter
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: filter
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: buffer
  - type: PlumbingFilter
    filterNodeName: outletFilter
    passthroughNodeName: outletPassthrough
    bufferSolutionName: buffer
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: buffer
    outletNames:
    - outletFilter
    - outletPassthrough
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 40
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outletFilter:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outletPassthrough:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: AtmosPipeColor
    color: "#8B4513"
  - type: UserInterface
    interfaces:
      enum.PlumbingFilterUiKey.Key:
        type: PlumbingFilterBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingFilterUiKey.Key
  - type: Flippable
    mirrorEntity: OH14_PlumbingFilterFlipped
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 125

- type: entity
  parent: OH14_PlumbingFilter
  id: OH14_PlumbingFilterFlipped
  suffix: Flipped
  components:
  - type: Construction
    graph: OH14_PlumbingFilter
    node: OH14_PlumbingFilterFlipped
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: filterF
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
      outletFilter:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outletPassthrough:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
  - type: Flippable
    mirrorEntity: OH14_PlumbingFilter

# =============================================================================
# Plumbing Synthesizer - generates reagents from power
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingSynthesizer
  name: Plumbing Synthesizer
  description: Generates basic reagents using power from an internal battery.
  suffix: НЕ МАППИТЬ
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    noRot: false
    layers:
    - state: synthesizer
    - state: synthesizer_overlay
      map: [ "enum.PlumbingVisualLayers.Overlay" ]
      visible: false
  - type: GenericVisualizer
    visuals:
      enum.PlumbingVisuals.Running:
        enum.PlumbingVisualLayers.Overlay:
          True: { visible: true }
          False: { visible: false }
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingSynthesizer
    bufferSolutionName: buffer
    generatableReagents:
      Iron: 2
      Carbon: 2
      Copper: 2
      Hydrogen: 2
      Oxygen: 0
      Sugar: 2
      Silicon: 5
      Phosphorus: 5
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: buffer
  - type: SolutionContainerManager
    solutions:
      buffer:
        maxVol: 10
        canReact: false
  - type: ExaminableSolution
    solution: buffer
  - type: NodeContainer
    nodes:
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: TSouth
  - type: UserInterface
    interfaces:
      enum.PlumbingSynthesizerUiKey.Key:
        type: PlumbingSynthesizerBoundUserInterface
  - type: ActivatableUI
    key: enum.PlumbingSynthesizerUiKey.Key
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellMedium
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot
  - type: Charger
    slotId: cell_slot
    chargeRate: 5
    passiveDraw: 1
  - type: ApcPowerReceiver
    powerLoad: 1
  - type: ExtensionCableReceiver
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: buffer
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 200
# =============================================================================
# Plumbing Drain - floor drain that outputs to plumbing network
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingDrain
  name: водопроводный слив
  description: Все стекающие жидкости рядом попадают именно сюда.
  placement:
    mode: SnapgridCenter
  components:
  - type: Sprite
    drawdepth: FloorObjects
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: drain
    - map: [ "enum.SolutionContainerLayers.Fill" ]
      state: drain-fill-1
      visible: false
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
