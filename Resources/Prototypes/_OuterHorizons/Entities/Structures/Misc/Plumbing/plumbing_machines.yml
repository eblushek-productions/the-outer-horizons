# Base plumbing machine entity - all plumbing machines inherit from this
- type: entity
  abstract: true
  id: OH14_PlumbingMachineBase
  parent: OH14_BaseStructure
  placement:
    mode: SnapgridCenter
  components:
  - type: Physics
    bodyType: Static
  # - type: Fixtures
  #   fixtures:
  #     fix1:
  #       shape:
  #         !type:PhysShapeAabb
  #         bounds: -0.25,-0.25,0.25,0.25
  #       density: 190
  #       mask:
  #       - MachineMask
  #       layer:
  #       - MachineLayer
  - type: Transform
    anchored: true
    noRot: false
  - type: Sprite
    noRot: true  # Allow rotation so connectors face correct direction
  - type: Clickable
  - type: Appearance
  - type: PlumbingConnectorAppearance
    # offset: 0.09375
  - type: InteractionOutline
  - type: Anchorable
  - type: Pullable
  - type: Rotatable
    rotateWhileAnchored: true
  - type: AtmosPipeColor
  - type: RCDDeconstructable
    cost: 2
    delay: 2
    fx: EffectRCDDeconstruct2
    rpld: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic

# =============================================================================
# Plumbing Tank - stores reagents in the network
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingTank
  name: трубопроводный резервуар
  description: Большой как твоя мать, хранит до 2х тысяч унций жидкостей.
  components:
  - type: Construction
    graph: OH14_PlumbingTank
    node: OH14_PlumbingTank
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: tank
  - type: PlumbingDevice
    updateInterval: 2
    solutionLimit: 1900
  - type: PlumbingInlet
    solutionName: tank
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 2000
        canReact: false
  - type: ExaminableSolution
    solution: tank
  - type: NodeContainer
    nodes:
      inlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: TSouth
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: tank
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100

- type: entity
  parent: OH14_PlumbingTank
  id: OH14_PlumbingTankFuelEmpty
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: tank_fuel

- type: entity
  parent: OH14_PlumbingTank
  id: OH14_PlumbingTankFuel
  suffix: Топливо
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: tank_fuel
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: Hydrogen # TODO, доработать заглушку в виде водорода
          Quantity: 1500

- type: entity
  parent: OH14_PlumbingTank
  id: OH14_PlumbingTankWater
  suffix: Вода
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        reagents:
        - ReagentId: Water
          Quantity: 1500

# =============================================================================
# Plumbing Input - pour reagents into the network
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingInput
  name: водопроводный входной буфер
  description: Позволит тебе залить в местную сеть трубопровода яд.
  components:
  - type: Construction
    graph: OH14_PlumbingInput
    node: OH14_PlumbingInput
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3
        friction: 0.2
  - type: Sprite
    sprite: _OuterHorizons/Structures/Misc/Plumbing/plumbers.rsi
    layers:
    - state: pipe_input
  - type: PlumbingInput
    solutionName: input
  - type: Plungeable
  - type: PlumbingOutlet
    solutionName: input
  - type: SolutionContainerManager
    solutions:
      input:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: input
  - type: NodeContainer
    nodes:
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: Fourway
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: input
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 75

# =============================================================================
# Plumbing Sink - draws reagents from the network, has an outlet for solutions dumped into it
# =============================================================================
- type: entity
  parent: OH14_PlumbingMachineBase
  id: OH14_PlumbingSink
  name: раковина
  description: Если ты можешь позволить помыть себе руки - ты богат. Если ты можешь позволить себе душ - ты невъебически богат.
  components:
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Sprite
    noRot: false
    sprite: _OuterHorizons/Structures/Misc/Plumbing/sink.rsi
    # drawdepth: FloorObjects
    layers:
    - state: sink
      offset: 0, 0.3
  - type: Rotatable
    rotateWhileAnchored: false
  - type: PlumbingDevice
    updateInterval: 2
  - type: PlumbingInlet
    solutionName: output
    inletNames:
    - inletNorth
    - inletEast
    - inletWest
  - type: PlumbingOutput
    solutionName: output
  - type: PlumbingOutlet
    solutionName: drain
  - type: DumpableSolution
    solution: drain
  - type: Plungeable
  - type: SolutionContainerManager
    solutions:
      output:
        maxVol: 100
        canReact: false
      drain:
        maxVol: 100
        canReact: false
  - type: ExaminableSolution
    solution: output
  - type: NodeContainer
    nodes:
      inletNorth:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: North
      inletEast:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: East
      inletWest:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: West
      outlet:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:SpillBehavior
        solution: output
      - !type:SpillBehavior
        solution: drain
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: StaticPrice
    price: 100

