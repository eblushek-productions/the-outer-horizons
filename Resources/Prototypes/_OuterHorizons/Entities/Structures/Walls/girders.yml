- type: entity
  id: OH14_Girder
  parent: OH14_BaseStructureDynamic
  name: каркас
  description: Большая заготовка для самого интересного что есть в этой игре - ебучие текстурки стенок.
  components:
  - type: Transform
    anchored: true
    # noRot: false
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 150
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: InteractionOutline
  - type: Construction
    graph: OH14_Girder
    node: OH14_Girder
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/girders.rsi
    state: wall_girder
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: Climbable

- type: entity
  id: OH14_WindowGirder
  parent: OH14_Girder
  name: каркас окна
  components:
  - type: Construction
    graph: OH14_Window
    node: OH14_WindowGirder
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/girders.rsi
    state: window_girder

- type: entity
  id: OH14_ReinforcedGirder
  parent: OH14_Girder
  name: укрепленный каркас
  description: A large structural assembly made out of metal and plasteel; It requires a layer of plasteel before it can be considered a reinforced wall.
  components:
    - type: Sprite
      sprite: _OuterHorizons/Structures/Walls/girders.rsi
      state: reinforced_wall_girder
    - type: Construction
      graph: OH14_Girder
      node: OH14_ReinforcedGirder
