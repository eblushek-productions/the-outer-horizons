- type: entity
  parent: BaseWall
  id: OH14_BaseWallRock
  categories: [ ForkFiltered ]
  name: каменная порода
  suffix: Астероид
  description: Хранит камни внутри и грейтайдов снаружи.
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: OH14_StoneDamage
  - type: SpaceGarbage
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 2
    trackAllDamage: true
    damageOverlay:
      sprite: _OuterHorizons/Structures/Walls/damage.rsi
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_rock.rsi
    state: full
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_rock.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 40
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_Cobblestone1:
            min: 0
            max: 1
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: OH14_Rock
  - type: IconSmooth
    key: walls
    base: wall
  - type: GuideHelp
    guides:
    - OH14_GuideResources

- type: entity
  parent: OH14_BaseWallRock
  id: OH14_BaseWallStone
  name: плотная каменная порода
  suffix: Астероид
  description: Защищает руды внутри от грейтайдов снаружи.
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: OH14_HeavyRock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_Cobblestone1:
            min: 0
            max: 1
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_stone.rsi
    state: full
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/Planet/asteroid_stone.rsi
    state: full

