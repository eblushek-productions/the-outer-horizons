- type: entity
  parent: [ BaseDeltaPressurePlasmaQuarter, BaseWall ]
  id: OH14_BaseWall
  categories: [ ForkFiltered ]
  name: обыкновенная стена
  description: Держит экипаж внутри и грейтайдов снаружи.
  components:
  - type: Repairable
  - type: SpaceGarbage
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 8
    trackAllDamage: true
    damageOverlay:
      sprite: _OuterHorizons/Structures/Walls/damage.rsi
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: OH14_MetalThud
  - type: ExaminableDamage
    messages: OH14_WallMessages
  - type: Construction
    graph: OH14_Girder
    node: OH14_Wall
  - type: Tag
    tags:
      - Wall
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/basic.rsi
    state: full
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/basic.rsi
    state: full
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: OH14_Girder
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
  - type: IconSmooth
    key: walls
    base: wall

- type: entity
  parent: [ BaseDeltaPressureReinforcedGlass, WallDiagonalBase ]
  id: OH14_WallDiagonal
  categories: [ ForkFiltered ]
  name: диагональная стена
  description: Держит экипаж внутри и грейтайдов снаружи. Теперь с аеродинамическими приколами!
  components:
  - type: SpaceGarbage
  - type: Sprite
    drawdepth: Walls
    sprite: _OuterHorizons/Structures/Walls/basic_diagonal.rsi
    state: state0
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/basic_diagonal.rsi
    state: state0
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:PlaySoundBehavior
          sound:
            collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: OH14_Girder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  parent: [ BaseDeltaPressurePlasma, OH14_BaseWall ]
  id: OH14_WallReinforced
  categories: [ ForkFiltered ]
  name: укрепленная стена
  components:
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 10
    trackAllDamage: true
    damageOverlay:
      sprite: _OuterHorizons/Structures/Walls/damage.rsi
  - type: Sprite
    sprite: _OuterHorizons/Structures/Walls/reinforced.rsi
  - type: Icon
    sprite: _OuterHorizons/Structures/Walls/reinforced.rsi
    state: full
  - type: Construction
    graph: OH14_Girder
    node: OH14_ReinforcedWall
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 450
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: OH14_Girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: IconSmooth
    key: walls
    base: wall
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ReinforcedWallVisuals.DeconstructionStage:
        ReinforcedWallVisualLayers.Deconstruction:
          -1: { visible: false }
          0: { state: reinf_construct-5, visible: true}
          1: { state: reinf_construct-4, visible: true}
          2: { state: reinf_construct-3, visible: true}
          3: { state: reinf_construct-2, visible: true}
          4: { state: reinf_construct-1, visible: true}
          5: { state: reinf_construct-0, visible: true}
  - type: ReinforcedWallReplacementMarker
  - type: StaticPrice
    price: 115
  - type: RadiationBlocker
    resistance: 5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000

