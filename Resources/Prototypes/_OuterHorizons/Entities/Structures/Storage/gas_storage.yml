- type: entity
  parent: OH14_BaseStructure
  id: OH14_BaseGasStorage
  abstract: true
  name: цистерна
  description: Большое хранилище для хранения газов. Переносу не подлежит.
  components:
    - type: Appearance
    - type: PipeColorVisuals
    - type: AtmosPipeColor
    - type: AtmosPipeLayers
      # spriteRsiPaths: {}
      spriteLayersRsiPaths:
        enum.PipeVisualLayers.Pipe:
          Primary: _OuterHorizons/Structures/Misc/Atmospherics/pipe.rsi
          Secondary: _OuterHorizons/Structures/Misc/Atmospherics/pipe_alt1.rsi
          Tertiary: _OuterHorizons/Structures/Misc/Atmospherics/pipe_alt2.rsi
    - type: DeviceNetwork
      deviceNetId: AtmosDevices
      receiveFrequencyId: AtmosMonitor
      transmitFrequencyId: AtmosMonitor
      sendBroadcastAttemptEvent: true
      examinableAddress: true
    - type: AtmosDevice
      joinSystem: true
    - type: Anchorable
    - type: InteractionOutline
    - type: Transform
      # noRot: true
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: Construction
      graph: OH14_GasStorage
      node: OH14_GasStorage
    - type: NodeContainer
      nodes:
        port:
          !type:PortablePipeNode
          nodeGroupID: Pipe
          pipeDirection: South
          # volume: 1
    - type: AtmosMonitoringConsoleDevice
      navMapBlip: GasVentOpening
    - type: Sprite
      # noRot: true
      sprite: _OuterHorizons/Structures/Storage/gas_storage.rsi
      layers:
        - sprite: _OuterHorizons/Structures/Misc/Atmospherics/pipe.rsi
          state: pipeConnector
          map: [ "enum.PipeVisualLayers.Pipe" ]
        - state: yellow
          # map: [ "enum.SubfloorLayers.FirstLayer" ]
    - type: GasCanister
      gasMixture:
        volume: 5000
        moles: # List of gasses for easy reference
          - 0 # oxygen
          - 0 # nitrogen
          - 0 # CO2
          - 0 # Plasma
          - 0 # Tritium
          - 0 # Water vapor
          - 0 # Ammonia
          - 0 # N2O
          - 0 # Frezon
        temperature: 273.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

