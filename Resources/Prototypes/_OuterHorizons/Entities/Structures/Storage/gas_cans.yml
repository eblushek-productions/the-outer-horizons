# Broken

- type: entity
  parent: OH14_BaseStructureDynamic
  id: OH14_GasCanisterBrokenBase
  name: лопнувшая газовая канистра
  description: Лопнувшая под воздействием давления или деформации, футуристичная и не практичная, в прошлом, бочка для газа.
  components:
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 200
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 100
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            OH14_SheetMaterials1:
              min: 1
              max: 2
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - type: Damageable
      damageContainer: Inorganic
      damageModifierSet: Metallic
    - type: InteractionOutline
    - type: Sprite
      sprite: _OuterHorizons/Structures/Storage/canister.rsi
      state: grey-1
    - type: Physics
      bodyType: Dynamic
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeAabb
            bounds: "-0.4,-0.3,0.4,0.3"
          density: 190
          mask:
          - MachineMask
          layer:
          - MachineLayer
    - type: PhysicalComposition
      materialComposition:
        Steel: 500
    - type: StaticPrice
      price: 60

- type: entity
  parent: OH14_GasCanisterBrokenBase
  id: OH14_StorageCanisterBroken
  components:
  - type: Sprite
    state: yellow-1

