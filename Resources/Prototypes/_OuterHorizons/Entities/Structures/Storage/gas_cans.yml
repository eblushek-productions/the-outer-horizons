- type: entity
  id: OH14_GasCanisterFrame
  parent: OH14_FrameBasic
  name: каркас канистры
  description: Каркас вашего газового хранилища, ветхий и не надежный.
  components:
  - type: Transform
    anchored: false
  - type: Sprite
    sprite: _OuterHorizons/Structures/Storage/canister.rsi
    state: frame
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable
  - type: Construction
    graph: OH14_GasCanister
    node: frame
