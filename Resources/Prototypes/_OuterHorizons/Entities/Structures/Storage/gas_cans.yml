- type: entity
  parent: GasCanister
  categories: [ ForkFiltered ]
  id: OH14_StorageCanister
  name: газовая канистра
  description: Футуристичная бочка газа, с навороченными ручками, дисплеем и клапанами. Крайне не практичная хрень, но у тебя не особо есть выбор.
  suffix: Пустая
  components:
    - type: Construction
      graph: OH14_GasCanister
      node: OH14_GasCanister
    - type: Sprite
      sprite: _OuterHorizons/Structures/Storage/canister.rsi
      layers:
        - state: yellow
    - type: Fixtures
      fixtures:
        fix1:
          shape:
            !type:PhysShapeCircle
            radius: 0.35
          density: 400
          mask:
          - CrateMask #this is so they can go under plastic flaps
          layer:
          - MachineLayer
    - type: GasCanister
      gasTankSlot:
        insertSound: /Audio/_OuterHorizons/Storage/canister_in.ogg
        ejectSound: /Audio/_OuterHorizons/Storage/canister_out.ogg
      gasMixture:
        volume: 1500
        moles: # List of gasses for easy reference
          - 0 # oxygen
          - 0 # nitrogen
          - 0 # CO2
          - 0 # Plasma
          - 0 # Tritium
          - 0 # Water vapor
          - 0 # Ammonia
          - 0 # N2O
          - 0 # Frezon
        temperature: 293.15
    - type: Destructible
      thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 600
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
      - trigger:
          !type:DamageTrigger
          damage: 300
        behaviors:
        - !type:PlaySoundBehavior
          sound:
            collection: MetalBreak
        - !type:SpawnEntitiesBehavior
          spawn:
            OH14_StorageCanisterBroken:
              min: 1
              max: 1
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
        - !type:DumpCanisterBehavior

