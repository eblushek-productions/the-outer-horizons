    - state: basic_open
      map: [ top ]
      visible: false
  - type: Storage
    grid:
    - 0,0,7,7
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.45
        density: 600
        mask:
        - CrateMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer

