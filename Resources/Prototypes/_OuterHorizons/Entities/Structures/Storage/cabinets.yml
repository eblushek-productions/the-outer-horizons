- type: entity
  id: OH14_CabinetBasic
  parent: OH14_BaseStructureDynamic
  name: шкаф
  description: Большой вертикальный шкаф для рабочих иструментов. Не предназначен для спаривания внутри.
  components:
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.StorageVisuals.Open:
        top:
          True: { visible: true }
          False: { visible: false }
  # - type: Climbable
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: _OuterHorizons/Structures/Storage/cabinet.rsi
    noRot: true
    layers:
    - state: basic
    - state: basic_open
      map: [ top ]
      visible: false
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 60
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Storage
    storageOpenSound: /Audio/_OuterHorizons/Storage/cabinet_open.ogg
    storageCloseSound: /Audio/_OuterHorizons/Storage/cabinet_close.ogg
    storageInsertSound: /Audio/_OuterHorizons/Items/drop.ogg # TODO, звуки предметов под замену
    storageRemoveSound: /Audio/_OuterHorizons/Items/pickup.ogg
    grid:
    - 0,0,3,7
    maxItemSize: Huge
  - type: ContainerContainer
    containers:
      storagebase: !type:Container
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.35
        density: 400
        mask:
        - CrateMask #this is so they can go under plastic flaps
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Clickable
  - type: Anchorable
  # - type: Rotatable
  - type: Construction
    graph: OH14_CabinetBasic
    node: OH14_CabinetBasic

- type: entity
  id: OH14_CabinetBig
