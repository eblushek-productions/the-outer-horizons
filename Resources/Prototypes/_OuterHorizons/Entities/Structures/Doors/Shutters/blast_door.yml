- type: entity
  id: OH14_HeavyShutter
  parent: OH14_BasicShutter
  name: гермозатвор
  description: Легко разломает тебе череп, когда дверка начнет спускаться вниз.
  components:
  - type: AccessReader
    containerAccessProvider: board
  - type: Sprite
    sprite: _OuterHorizons/Structures/Doors/Shutters/heavy.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: welded
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: Door
    performCollisionCheck: false
    closeTimeOne: 0.4
    closeTimeTwo: 0.4
    openTimeOne: 0.4
    openTimeTwo: 0.4
    openingAnimationTime: 1.0
    closingAnimationTime: 1.0
    canPry: false
    doorStunTime: 5
    crushDamage:
      types:
        Blunt: 45 # yowch
    openSound:
      path: /Audio/_OuterHorizons/Machines/Shutters/blast_open.ogg
    closeSound:
      path: /Audio/_OuterHorizons/Machines/Shutters/blast_open.ogg
  - type: Occluder
  - type: Appearance
  - type: RadiationBlocker
    resistance: 4
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StrongMetallic
  - type: ContainerFill
    containers:
      board: [ DoorElectronics ]
  # - type: Construction
  #   graph: BlastDoor
  #   node: blastdoor
  #   containers:
  #   - board
  # - type: StaticPrice
  #   price: 500
  - type: InteractionPopup
    interactSuccessString: comp-window-knock
    messagePerceivedByOthers: comp-window-knock
    interactSuccessSound:
      path: /Audio/Effects/glass_knock.ogg

- type: entity
  id: OH14_HeavyShutterOpen
  parent: OH14_HeavyShutter
  suffix: Открыт
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

