- type: entity
  id: OH14_Catwalk
  categories: [ ForkFiltered ]
  name: мостик
  description: Мостик, да, это мостик, для пола, для техов, для пропастей.
  placement:
    mode: SnapgridCenter
  components:
  - type: Anchorable
    flags:
    - Anchorable
  - type: Rotatable
  - type: Clickable
  - type: Sprite
    sprite: _OuterHorizons/Structures/catwalk.rsi
    drawdepth: FloorTiles
  - type: Icon
    sprite: _OuterHorizons/Structures/catwalk.rsi
    state: catwalk_preview
  - type: Transform
    anchored: true
  - type: IconSmooth
    key: catwalk
    base: catwalk_
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 4
  - type: Tag
    tags:
      - Catwalk
  # - type: Construction
  #   graph: Catwalk
  #   node: Catwalk
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      # - !type:SpawnEntitiesBehavior
      #   spawn:
      #     PartRodMetal: # takes two to construct, so drop less than that
      #       min: 0
      #       max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: TrayScanReveal
