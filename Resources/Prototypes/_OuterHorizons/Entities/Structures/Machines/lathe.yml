- type: entity
  id: OH14_ArcFurnance
  parent: OH14_BasicLathe
  name: дуговая печь
  description: Электрическая печь для плавки простых металлов (не сплавов). При работе имеет свойство нагревать атмосферу, из-за нелепого радиатора сбоку.
  components:
  - type: Construction
    graph: OH14_ArcFurnanceFrame
    node: OH14_ArcFurnance
  - type: Sprite
    sprite: _OuterHorizons/Structures/Machines/arcfurnace.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
      shader: unshaded
      map: ["enum.PowerDeviceVisualLayers.Powered"]
    - state: inserting
      map: ["enum.MaterialStorageVisualLayers.Inserting"]
  - type: MaterialStorage
    ignoreColor: true
    whitelist: &OH14_MaterialWhitelistFurnance
      tags:
        - OH14_Ore
  - type: Lathe
    producingSound: /Audio/_OuterHorizons/Machines/furnance.ogg
    idleState: icon
    runningState: icon
    unlitIdleState: unlit
    unlitRunningState: unlit-building
    staticPacks:
    - OH14_OreStatic
  - type: LatheHeatProducing
    energyPerSecond: 20000
  - type: ContainerContainer
    containers:
      machine_board: !type:Container
      machine_parts: !type:Container

