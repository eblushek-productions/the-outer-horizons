  description: Продвинутая автоматизированная установка для вашего крафта, чья крышка забрала на себя половину дизайна, дабы вы не лезли руками внутрь во время работы оборудования.
  components:
  - type: Construction
    graph: OH14_ProtolatheFrame
    node: OH14_Protolathe
  - type: PointLight
    radius: 2
    energy: 5.0
    enabled: false
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
    offset: "0, 0.5" # shine from the top, not bottom of the computer
    castShadows: false
    color: "#4eec45"
  - type: LitOnPowered
  - type: Sprite
    sprite: _OuterHorizons/Structures/Machines/protolathe.rsi
    snapCardinals: true
    layers:
    - state: icon
      map: ["enum.LatheVisualLayers.IsRunning"]
    - state: unlit
