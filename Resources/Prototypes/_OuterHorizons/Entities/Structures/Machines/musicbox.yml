- type: entity
  id: OH14_Musicbox
  name: музыкальный проигрыватель
  parent: [ BaseMachinePowered, OH14_BaseItem ]
  description: Шарманка, способная воспроизводить широкий спектр мелодий. Удовольствие не гарантируется.
  components:
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _OuterHorizons/Objects/Misc/musicbox.rsi
    layers:
    - state: off
      map: ["enum.JukeboxVisualLayers.Base"]
    - state: on_unshaded
      shader: unshaded
  - type: Transform
    anchored: true
  - type: Jukebox
    onState: off
    offState: off
    selectState: off
  - type: Appearance
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: ExtensionCableReceiver
  - type: ActivatableUI
    key: enum.JukeboxUiKey.Key
  - type: ActivatableUIRequiresPower
  - type: UserInterface
    interfaces:
        enum.JukeboxUiKey.Key:
          type: JukeboxBoundUserInterface
        enum.WiresUiKey.Key:
          type: WiresBoundUserInterface
  - type: WiresPanel
    screwdriverOpenSound: /Audio/_OuterHorizons/Machines/panel_open.ogg
    screwdriverCloseSound: /Audio/_OuterHorizons/Machines/panel_close.ogg
  - type: Wires
    boardName: wires-board-name-jukebox
    layoutId: Jukebox
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 2
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.45,0.25,0.45"
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
        density: 200
