- type: entity
  id: OH14_BasicStructureConsole
  parent: OH14_BaseStructure
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35"
        density: 190
        mask:
        - MachineMask
        layer:
        - MachineLayer
  - type: InteractionOutline
  - type: Rotatable
  - type: Anchorable
  - type: Construction
    graph: OH14_Console
    node: frameUnsecured
  - type: Sprite
    drawdepth: Objects
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Electronic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
          params:
            volume: -10
      - !type:ChangeConstructionNodeBehavior
        node: monitorBroken
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: OH14_ConsoleFrame
  parent: OH14_BasicStructureConsole
  name: каркас консоли
  description: Каркас консоли, на который еще предстоит скачать вирусы без крафтмайна.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Machines/consoles.rsi
    layers:
    - state: frame
      map: [ "enum.ConstructionVisuals.Layer" ]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          monitorMissing: { state: frame }
          monitorUnsecured: { state: frame_wires }

- type: entity
  parent: OH14_BasicStructureConsole
  id: OH14_ConsoleBroken
  name: сломанная консоль
  description: Блять, хорошо что сундуки остались наверху, так заебись вообще. ДА ТЫ ЧЕ-
  components:
  - type: Construction
    graph: OH14_Console
    node: monitorBroken
  - type: Sprite
    sprite: _OuterHorizons/Structures/Machines/consoles.rsi
    drawdepth: Objects
    state: broken
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalGlassBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
