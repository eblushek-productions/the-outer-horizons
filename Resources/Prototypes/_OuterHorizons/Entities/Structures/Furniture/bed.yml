- type: entity
  name: кровать
  id: OH14_Bed
  parent: OH14_BaseStructure
  description: Используется для сна, не ерп, суки.
  components:
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.1
        Blunt: -0.1
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.05"
        density: 250
        mask:
        - TableMask
  - type: Sprite
    sprite: _OuterHorizons/Structures/Decoration/furniture.rsi
    state: bed
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
  # - type: Construction
  #   graph: bed
  #   node: bed
  - type: PlaceableSurface
    placeCentered: true
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger: # Excess damage, don't spawn entities
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 2
  - type: Transform
    anchored: true
    # noRot: true
  - type: Anchorable
  - type: Pullable


- type: entity
  parent: OH14_Bed
  id: OH14_MedicalBed
  name: медецинская койка
  description: Склепаная на скорую руку койка для пациентов медблока. Ходят слухи что она обладает удивительными лечебными свойствами.
  components:
  - type: Sprite
    state: bed-MED
  - type: HealOnBuckle
    damage:
      types:
        Poison: -0.1
        Cold: -0.4
        Blunt: -0.2
  # - type: Construction
  #   graph: bed
  #   node: medicalbed
  - type: GuideHelp
    guides:
    - MedicalDoctor
