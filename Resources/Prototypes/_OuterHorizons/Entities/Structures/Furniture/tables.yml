- type: entity
  id: OH14_TableMetal
  categories: [ ForkFiltered ]
  parent: TableBase
  name: стол
  description: 9 мая в Анталии трое русских в течение восьми часов держали оборону шведского стола от немцев.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Decoration/Tables/generic.rsi
  - type: Icon
    sprite: _OuterHorizons/Structures/Decoration/Tables/generic.rsi
    state: full
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 125
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: metaltable
    base: state_
  - type: Construction
    graph: OH14_Table
    node: OH14_Table

- type: entity
  id: OH14_TableMetalAlt
  parent: OH14_TableMetal
  name: стол
  suffix: Альтернативный
  description: Металлический стол на четырех металлических ножках.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Decoration/Tables/generic_alt.rsi
  - type: Icon
    sprite: _OuterHorizons/Structures/Decoration/Tables/generic_alt.rsi
    state: full
  - type: Construction
    graph: OH14_Table
    node: OH14_Table

- type: entity
  id: OH14_TableFrame
  categories: [ ForkFiltered ]
  parent: OH14_BaseStructure
  name: каркас стола
  description: Металлический каркас стола, у меня нет идеи для этого описания.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Decoration/Tables/frame.rsi
    state: frame
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.40,-0.30,0.40,0.45"
        density: 80
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 5
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Construction
    graph: OH14_Table
    node: TableFrame
