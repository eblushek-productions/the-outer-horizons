- type: entity
  id: OH14_AlwaysPoweredWallLight
  parent: BaseWallmountGlass
  categories: [ ForkFiltered ]
  name: большой светильник
  description: Пока вы веселитесь в свету, кто-то умирает в темноте.
  suffix: Всегда запитан
  components:
  - type: MeleeSound
    soundGroups:
      Brute:
        collection: GlassSmash
  - type: Transform
    anchored: true
  - type: Clickable
  - type: InteractionOutline
  - type: Construction
    graph: OH14_Lights
    node: OH14_PoweredlightEmpty
  - type: Sprite
    sprite: _OuterHorizons/Structures/Wallmounts/Lighting/light_tube.rsi
    # offset: "0, -0.8"
    drawdepth: WallMountedItems
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded
    state: base
  - type: PointLight
    color: "#c1cbce" # FFE4CE > c1cbce
    energy: 0.8
    radius: 10
    softness: 1
    offset: "0, -0.6"
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,0.5,0.4,0.35"
        density: 190
        mask:
        - TabletopMachineMask
        layer:
        - TabletopMachineLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:EmptyAllContainersBehaviour
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 2
            max: 2
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount

- type: entity
  id: OH14_PoweredlightEmpty
  suffix: Пусто
  parent: OH14_AlwaysPoweredWallLight
  components:
  - type: Sprite
    sprite: _OuterHorizons/Structures/Wallmounts/Lighting/light_tube.rsi
    state: empty
  - type: PointLight
    enabled: false
  - type: PoweredLight
    bulb: Tube
    turnOnSound: /Audio/_OuterHorizons/Machines/light_on.ogg
  - type: ContainerContainer
    containers:
      light_bulb: !type:ContainerSlot
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SmartLight
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: Appearance
  - type: PoweredLightVisuals
    blinkingSound:
      path: "/Audio/_OuterHorizons/Machines/light_off.ogg"
    spriteStateMap:
      empty: empty
      off: base
      on: base
      broken: broken
      burned: burned
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand

- type: entity
  id: OH14_Poweredlight
  suffix: ""
  parent: OH14_PoweredlightEmpty
  components:
  - type: Sprite
    state: base
  - type: PointLight
    enabled: true
  - type: PoweredLight
    hasLampOnSpawn: OH14_LightTube
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -18
    range: 2
    sound:
      path: /Audio/Ambience/Objects/light_hum.ogg
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand

- type: entity
  id: OH14_PoweredlightWarm
  suffix: "Теплый"
  parent: OH14_Poweredlight
  components:
  - type: PointLight
    color: "#E48B57" # FFE4CE > e4a877
    energy: 0.8
    radius: 10
    softness: 0.5
    offset: "0, -0.6"
  - type: PoweredLight
    hasLampOnSpawn: OH14_LightTubeWarm

- type: entity
  id: OH14_PoweredlightGreen
  suffix: "Зеленый"
  parent: OH14_Poweredlight
  components:
  - type: PointLight
    color: "#69b68f"
    energy: 0.8
    radius: 8
    softness: 1.5
    offset: "0, -0.6"
  - type: PoweredLight
    hasLampOnSpawn: OH14_LightTubeGreen

