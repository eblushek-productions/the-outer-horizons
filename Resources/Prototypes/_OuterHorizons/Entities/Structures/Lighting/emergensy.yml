- type: entity
  id: OH14_EmergencyLight
  categories: [ ForkFiltered ]
  name: аварийная лампа
  description: Небольшая аварийная лампа с аккамулятором. Будет пищать еще какое-то время, пока в конце концов, это место не умрет в тишине.
  parent: AlwaysPoweredWallLight
  suffix: ""
  components:
  - type: PointLight
    enabled: false
    radius: 5
    energy: 0.6
    offset: "0, -0.6"
    color: "#7CFC00"
    mask: /Textures/_OuterHorizons/Effects/LightMasks/double_cone.png
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: Battery
    maxCharge: 30000
    startingCharge: 0
  - type: EmergencyLight
  - type: RotatingLight
    speed: 120
  - type: Sprite
    sprite: _OuterHorizons/Structures/Wallmounts/Lighting/emergency_light.rsi
    # offset: "0, -0.8"
    layers:
    - state: base
      map: [ "enum.EmergencyLightVisualLayers.Base" ]
    - state: emergency_light
      map: [ "enum.EmergencyLightVisualLayers.LightOff" ]
    - state: emergency_light_on
      map: [ "enum.EmergencyLightVisualLayers.LightOn" ]
      shader: "unshaded"
      visible: false
  - type: Appearance
  # - type: Construction
  #   graph: LightFixture
  #   node: emergencyLight
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors: #excess damage, don't spawn entities.
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 25
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          OH14_SheetMaterials1:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
  placement:
    mode: SnapgridCenter
    snap:
    - Wallmount
