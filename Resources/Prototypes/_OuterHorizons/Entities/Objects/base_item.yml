- type: entity
  name: "item"
  id: OH14_BaseItem
  categories: [ ForkFiltered ]
  abstract: true
  components:
  - type: Item
    size: Small
  - type: Animateable
  - type: Clickable
  - type: InteractionOutline
  - type: MovedByPressure
  - type: EmitSoundOnCollide
    sound:
      path: /Audio/_OuterHorizons/Items/pickup.ogg
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_OuterHorizons/Items/pickup.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_OuterHorizons/Items/drop.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_OuterHorizons/Items/drop.ogg
  - type: DamageOnHighSpeedImpact
    damage:
      types:
        Blunt: 5
    soundHit:
      collection: MetalThud
  - type: CollisionWake
  - type: GravityAffected
  - type: Physics
    bodyType: Dynamic
    fixedRotation: false
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 20
        mask:
        - ItemMask
        restitution: 0.3  # fite me
        friction: 0.2
  - type: Sprite
    drawdepth: Items
    noRot: false
  - type: Pullable
  - type: DamageExaminable

