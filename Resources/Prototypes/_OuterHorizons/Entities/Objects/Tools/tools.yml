- type: entity
  name: кусачки
  parent: OH14_BaseItem
  id: OH14_WirecutterBasic
  description: Проводам очень неприятно когда их кусают, но в целом похуй.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: cutters}
          False: {state: inworld}
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/wirecutter_drop.ogg
  - type: Tag
    tags:
    - OH14_Tools
    - PlantSampleTaker
    - Wirecutter
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/wirecutters.rsi
    layers:
    - state: inworld
      map: ["base"]
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Piercing: 2
    attackRate: 2 #open and close that shit on their arm like hell! because you sure aren't doing any damage with this
    soundHit:
      collection: OH14_Wirecutter
  - type: Tool
    qualities:
      - Cutting
    useSound:
      collection: OH14_Wirecutter
  - type: Item
    sprite: _OuterHorizons/Objects/Tools/wirecutters.rsi
    storedRotation: -90
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 30
  - type: Durability

