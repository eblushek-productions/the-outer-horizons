- type: entity
  name: мультитул
  parent: OH14_BaseItem
  id: OH14_MultitoolBasic
  description: В этой оранжевой коробочке кроется великая сила.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Tools/multitool.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/multitool_inworld.rsi}
        screen:
          True: {sprite: _OuterHorizons/Objects/Tools/multitool.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/multitool_inworld.rsi}
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/multitool_inworld.rsi
    layers:
    - state: icon
      map: ["base"]
    - state: green-unlit
      map: ["screen"]
      # shader: unshaded
  - type: Item
    size: Small
  - type: Tool
    qualities:
      - Pulsing
  - type: NetworkConfigurator
  - type: ActivatableUI
    key: enum.NetworkConfiguratorUiKey.List
    inHandsOnly: true
  - type: UserInterface
    interfaces:
      enum.NetworkConfiguratorUiKey.List:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Configure:
        type: NetworkConfiguratorBoundUserInterface
      enum.NetworkConfiguratorUiKey.Link:
        type: NetworkConfiguratorBoundUserInterface
  - type: Tag
    tags:
    - OH14_Tools
    - Multitool
    - DoorElectronicsConfigurator
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
      Plastic: 100
  - type: StaticPrice
    price: 56
  - type: GuideHelp
    guides:
    - Networking
    - WirePanels
    - Airlocks
    - InspectingPower

- type: entity
  name: дрель
  parent: OH14_BaseItem
  id: OH14_DrillBasic
  description: Простая ручная дрель.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Tools/drill.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/drill_inworld.rsi}
  - type: Tag
    tags:
    - OH14_Tools
    - Powerdrill
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/drill_inworld.rsi
    layers:
    - state: drill_screw
      map: ["base"]
  - type: Item
    sprite: _OuterHorizons/Objects/Tools/drill.rsi
    size: Small
  - type: Tool
    qualities:
      - Screwing
    speedModifier: 1.5
    useSound: /Audio/Items/drill_use.ogg
  - type: MultipleTool
    statusShowBehavior: true
    entries:
      - behavior: Screwing
        sprite:
          sprite: _OuterHorizons/Objects/Tools/drill_inworld.rsi
          state: drill_screw
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
      - behavior: Anchoring
        sprite:
          sprite: _OuterHorizons/Objects/Tools/drill_inworld.rsi
          state: drill_bolt
        useSound:
          path: /Audio/Items/drill_use.ogg
        changeSound:
          path: /Audio/Items/change_drill.ogg
  - type: PhysicalComposition
    materialComposition:
      Steel: 300
      Plastic: 100
  - type: StaticPrice
    price: 100
  - type: MeleeWeapon
    wideAnimationRotation: -90
    attackRate: 1.5
    damage:
      types:
        Piercing: 10
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
  - type: ContainerContainer
    containers:
      cell_slot: !type:ContainerSlot {}
  - type: PowerCellSlot
    cellSlotId: cell_slot
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
  - type: Durability
    useEnergy: true
    chargePerUse: 10

- type: entity
  parent: OH14_BaseItem
  id: OH14_GeigerCounter
  name: счетчик гейгера
  description: Ручное устройство для измерения уровня радиации.
  components:
  - type: InworldSprite
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/geiger_inworld.rsi
    layers:
      - state: geiger_base
        map: ["base"]
      - state: geiger_on_idle
        map: ["enum.GeigerLayers.Screen"]
        shader: unshaded
        visible: false
  - type: Item
    sprite: _OuterHorizons/Objects/Tools/geiger.rsi
  - type: Geiger
    showControl: true
    showExamine: true
    broadcastAudio: true
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Tools/geiger.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/geiger_inworld.rsi}
        GeigerLayers.Screen:
          True: {sprite: _OuterHorizons/Objects/Tools/geiger.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/geiger_inworld.rsi}
      enum.GeigerVisuals.IsEnabled:
        GeigerLayers.Screen:
          True: { visible: True }
          False: { visible: False }
      enum.GeigerVisuals.DangerLevel:
        GeigerLayers.Screen:
          None: {state: geiger_on_idle}
          Low: {state: geiger_on_low}
          Med: {state: geiger_on_med}
          High: {state: geiger_on_high}
          Extreme: {state: geiger_on_ext}
  - type: PhysicalComposition
    materialComposition:
      Plastic: 100
  - type: Tag
    tags:
    - OH14_Tools
    - GeigerCounter
