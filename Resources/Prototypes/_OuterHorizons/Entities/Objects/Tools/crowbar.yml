- type: entity
  name: монтировка
  description: Инновационная вещь в сфере вскрытия шлюзов и черепушек!
  parent: [ OH14_ItemSFXTool, OH14_BaseItem ]
  id: OH14_BaseCrowbar
  abstract: true
  components:
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/crowbar_drop.ogg
  - type: Tag
    tags:
    - OH14_Tools
    - Crowbar
  - type: MeleeWeapon
    wideAnimationRotation: -135
    damage:
      types:
        Blunt: 8
    soundHit:
      collection: MetalThud
  - type: Tool
    qualities:
      - Prying
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: ToolTileCompatible
  - type: PhysicalComposition
    materialComposition:
      Steel: 100
  - type: StaticPrice
    price: 22
  - type: Prying
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/crowbar.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Tools/crowbar.rsi
    size: Normal
    shape:
    - 0,0,0,1

- type: entity
  parent: OH14_BaseCrowbar
  id: OH14_CrowbarBasic
  components:
  - type: Sprite
    state: icon
  - type: Item
    storedSprite:
      sprite: _OuterHorizons/Objects/Tools/crowbar.rsi
      state: storage
