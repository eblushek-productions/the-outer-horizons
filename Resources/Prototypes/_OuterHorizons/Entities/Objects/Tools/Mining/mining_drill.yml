  suffix: Железный
  description: Обычный.
  components:
  - type: InworldSprite
  - type: Tag
    tags:
    - OH14_MiningDrillTip
  - type: Item
    size: Small
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: l-tip}
          False: {state: l-tip_inworld}
  - type: Sprite
