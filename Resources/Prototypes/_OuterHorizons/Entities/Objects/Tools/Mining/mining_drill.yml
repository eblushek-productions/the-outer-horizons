# Буры

- type: entity
  parent: OH14_BaseItem
  id: OH14_MiningDrill
  name: обыкновенный ручной бур
  description: Компактный бур для шахтерских изысканий. Тыкни отверткой для извлечения наконечника.
  components:
  - type: Construction
    graph: OH14_MiningDrill
    node: OH14_MiningDrill
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: l-icon}
          False: {state: l-inworld}
  - type: Item
    size: Normal
    storedRotation: 0
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/mining_drill.rsi
    layers:
    - state: l-inworld
      map: ["base"]
  - type: MeleeWeapon
    autoAttack: true
    angle: 0
    wideAnimationRotation: -90
    soundHit:
      path: "/Audio/Items/drill_hit.ogg"
    attackRate: 1.8
    damage:
      groups:
        Brute: 10
      types:
        Structural: 15

- type: entity
  parent: OH14_MiningDrill
  id: OH14_MiningDrillT2
  name: улучшенный ручной бур
