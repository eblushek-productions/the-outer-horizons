# Каркас

- type: entity
  parent: OH14_BasicComponents
  id: OH14_MiningDrillConstruction
  name: каркас ручного бура
  description: Пока что он еще не БЖЖ-БЖЖ.
  components:
  - type: Construction
    graph: OH14_MiningDrill
    node: start
  - type: Item
    size: Normal
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/mining_drill.rsi
    state: construction-icon-0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ConstructionVisuals.Key:
        enum.ConstructionVisuals.Layer:
          start: { state: construction-icon-0 }
          OH14_Frame1: { state: construction-icon-1 }
          OH14_Frame2: { state: construction-icon-2 }
