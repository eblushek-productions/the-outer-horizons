# Основные кирки

- type: entity
  name: обыкновенная кирка
  parent: OH14_BaseItem
  id: OH14_Pickaxe
  description: Доисторическая ковырялка для каменных пород.
  components:
  - type: Appearance
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: pickaxe}
          False: {state: inworld}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/pickaxe.rsi
    layers:
    - state: inworld
      map: ["base"]
  - type: MeleeWeapon
    attackRate: 0.8
    wideAnimationRotation: -135
    soundHit:
      path: "/Audio/Weapons/smash.ogg"
      params:
        volume: -5
    damage:
      groups:
        Brute: 5
  - type: Wieldable
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 10
      types:
        Structural: 10
  - type: Item
    size: Normal
    shape:
    - 0,0,1,2
    storedRotation: -45
  - type: UseDelay
  - type: Construction
    graph: OH14_PickaxeTip
    node: OH14_Pickaxe

- type: entity
  name: улучшенная кирка
  parent: OH14_Pickaxe
  id: OH14_PickaxeT2
  description: Ковырялка для каменных пород с улучшенным наконечником.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/pickaxe_2.rsi
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 10
      types:
        Structural: 25
  - type: Construction
    graph: OH14_PickaxeTipT2
    node: OH14_PickaxeT2

- type: entity
  name: продвинутая кирка
  parent: OH14_Pickaxe
  id: OH14_PickaxeT3
  description: Инструмент для каменных пород с улучшенным наконечником.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/pickaxe_3.rsi
  - type: IncreaseDamageOnWield
    damage:
      groups:
        Brute: 10
      types:
        Structural: 35
  - type: Construction
    graph: OH14_PickaxeTipT3
    node: OH14_PickaxeT3

# Их наконечники

- type: entity
  parent: OH14_BasicComponents
  id: OH14_PickaxeTip
  name: наконечник кирки
  suffix: Железный
  description: Тыкни по нему рукояткой.
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {state: tip}
          False: {state: tip_inworld}
  - type: Item
    size: Small
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/pickaxe.rsi
    layers:
    - state: tip_inworld
      map: ["base"]
  - type: Construction
    graph: OH14_PickaxeTip
    node: start

- type: entity
  parent: OH14_PickaxeTip
  id: OH14_PickaxeTipT2
  suffix: Кобальтовый
  description: Улучшенный, тыкни по нему рукояткой.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/pickaxe_2.rsi
  - type: Construction
    graph: OH14_PickaxeTipT2
    node: start

- type: entity
  parent: OH14_PickaxeTip
  id: OH14_PickaxeTipT3
  suffix: Платиновый
  description: Продвинутый, тыкни по нему рукояткой.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/Mining/pickaxe_3.rsi
  - type: Construction
    graph: OH14_PickaxeTipT3
    node: start
