- type: entity
  name: ваккумная сварка
  parent: [ OH14_ItemSFXAlt, OH14_BaseItem ]
  id: OH14_WelderBasic
  description: Скажи похуй внешним условиям ваккума!
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { visible: true }
          False: { visible: false }
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Tools/welder.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/welder_inworld.rsi}
        enum.ToggleableVisuals.Layer:
          True: {sprite: _OuterHorizons/Objects/Tools/welder.rsi}
          False: {sprite: _OuterHorizons/Objects/Tools/welder_inworld.rsi}
  - type: EmitSoundOnLand
    sound:
      path: /Audio/Items/welder_drop.ogg
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/welder_inworld.rsi
    layers:
    - state: icon
      map: ["base"]
    - state: welder_flame
      visible: false
      shader: unshaded
      map: ["enum.ToggleableVisuals.Layer"]
  - type: Item
    size: Normal
    sprite: _OuterHorizons/Objects/Tools/welder.rsi
  - type: ItemToggle
    predictable: false
    soundActivate:
      collection: WelderOn
      params:
        variation: 0.125
        volume: -5
    soundDeactivate:
      collection: WelderOff
      params:
        variation: 0.125
        volume: -5
  - type: ItemToggleMeleeWeapon
    activatedSoundOnHit:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -10
    activatedSoundOnHitNoDamage:
      path: /Audio/Weapons/Guns/Hits/energy_meat1.ogg
      params:
        variation: 0.250
        volume: -12
    deactivatedSoundOnHitNoDamage:
      collection: MetalThud
    activatedDamage:
        types:
            Heat: 8
  - type: ItemToggleHot
  - type: ComponentToggler
    components:
    - type: DisarmMalus
      malus: 0.6
  - type: ToggleableVisuals
    spriteLayer: flame
    inhandVisuals:
      left:
      - state: inhand-left-flame
        shader: unshaded
      right:
      - state: inhand-right-flame
        shader: unshaded
  - type: UseDelay
  - type: MeleeWeapon
    wideAnimationRotation: -90
    damage:
      types:
        Blunt: 5 #i mean... i GUESS you could use it like that
    soundHit:
      collection: MetalThud
  - type: RefillableSolution
    solution: Welder
  - type: SolutionContainerManager
    solutions:
      Welder:
        reagents:
        - ReagentId: Hydrogen # TODO, доработать заглушку в виде водорода
          Quantity: 200
        maxVol: 200
  - type: Tool
    useSound:
      collection: Welder
    qualities: Welding
  - type: Welder
    fuelReagent: Hydrogen # TODO, доработать заглушку в виде водорода
  - type: PointLight
    enabled: false
    radius: 1.5
    color: orange
    netsync: false
  - type: ItemTogglePointLight
  - type: Appearance
  - type: RequiresEyeProtection
  - type: IgnitionSource
    temperature: 700
  - type: Tag
    tags:
    - OH14_Tools

- type: entity
  name: ваккумная сварка
  parent: OH14_WelderBasic
  id: OH14_WelderEmpty
  suffix: Пуст
  components:
  - type: SolutionContainerManager
    solutions:
      Welder:
        # reagents:
        # - ReagentId: Hydrogen # TODO, доработать заглушку в виде водорода
        #   Quantity: 0
        maxVol: 200

- type: entity
  name: паяльник
  parent: OH14_WelderBasic
  id: OH14_SolderingIron
  description: Возможно, ничего было бы лучше чем это.
  components:
  - type: Sprite
    sprite: _OuterHorizons/Objects/Tools/welder_mini.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Tools/welder_mini.rsi
  - type: Tool
    speedModifier: 0.3
