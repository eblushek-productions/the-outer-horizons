# База

- type: entity
  parent: [ OH14_ItemSFXMetallic, OH14_BasicMaterialStack ]
  id: OH14_BasicStackSheet
  abstract: true
  name: лист
  description: Выплавленный из руды лист
  components:
  - type: InworldSprite
  - type: GenericVisualizer
    visuals:
      enum.InworldSpriteState.State:
        base:
          True: {sprite: _OuterHorizons/Objects/Materials/sheets.rsi}
          False: {sprite: _OuterHorizons/Objects/Materials/sheets_inworld.rsi}
  - type: Sprite
    sprite: _OuterHorizons/Objects/Materials/sheets_inworld.rsi
  - type: Item
    sprite: _OuterHorizons/Objects/Materials/sheets.rsi
  - type: Appearance
  - type: Tag
    tags:
    - OH14_MaterialStack

# Железо

- type: entity
  parent: OH14_BasicStackSheet
  id: OH14_SheetIron
  name: железный лист
  suffix: 16
  components:
  - type: FloorTile
    outputs:
    - OH14_PlatingLattice
    - OH14_Plating
  - type: Material
  - type: PhysicalComposition
    materialComposition:
      OH14_SheetIron: 100
  - type: Item
    heldPrefix: iron
  - type: Stack
    count: 16
    stackType: OH14_SheetIron
    baseLayer: base
    layerStates:
    - iron
    - iron_2
    - iron_3
  - type: Sprite
    layers:
    - state: iron_3
      map: ["base"]

- type: entity
  parent: OH14_SheetIron
  id: OH14_SheetIron8
  suffix: 8
  components:
  - type: Sprite
    state: iron_2
  - type: Stack
    stackType: OH14_SheetIron
    count: 8

- type: entity
  parent: OH14_SheetIron
  id: OH14_SheetIron1
  suffix: 1
  components:
  - type: Sprite
    state: iron
  - type: Stack
    stackType: OH14_SheetIron
    count: 1

