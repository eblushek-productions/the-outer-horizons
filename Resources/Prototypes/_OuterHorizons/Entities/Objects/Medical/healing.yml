- type: entity
  parent: OH14_BaseItem
  id: OH14_BaseHealingItem
  abstract: true
  components:
  - type: Healing
    delay: 1
    selfHealPenaltyMultiplier: 1.5
  - type: Appearance
  - type: Sprite
    sprite: _OuterHorizons/Objects/Specific/Medical/medical.rsi
  - type: Item
    size: Small
    sprite: _OuterHorizons/Objects/Specific/Medical/medical.rsi
    heldPrefix: ointment
  # Inherited
  - type: StaticPrice
    price: 0
  - type: Tag
    tags:
    - OH14_Medicines

- type: entity
  name: мазь
  description: Мазь от ожогов 4й степени. Да чувак, я тоже в ахуе.
  parent: OH14_BaseHealingItem
  id: OH14_Ointment
  suffix: Full
  components:
  - type: Tag
    tags:
    - Ointment
    - OH14_Medicines
  - type: Sprite
    state: ointment_3
    layers:
    - state: ointment_3
      map: ["base"]
  - type: Stack
    stackType: OH14_Ointment
    baseLayer: base
    layerStates:
    - ointment
    - ointment_2
    - ointment_3
    count: 8
  - type: Item
    heldPrefix: ointment
    storedRotation: 90
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Heat: -5
        Cold: -5
        Shock: -5
        Caustic: -1.5
    healingBeginSound:
      path: "/Audio/Items/Medical/ointment_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/ointment_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: StackPrice
    price: 5

- type: entity
  id: OH14_Ointment1
  parent: OH14_Ointment
  suffix: Single
  components:
  - type: Sprite
    state: ointment
  - type: Stack
    stackType: OH14_Ointment
    count: 1

- type: entity
  name: пластырь
  description: Пластыри от ушибов, переломов и вскрытых черепушек. Да чувак, я тоже в ахуе.
  parent: OH14_BaseHealingItem
  id: OH14_Brutepack
  suffix: Full
  components:
  - type: Tag
    tags:
    - Brutepack
    - OH14_Medicines
  - type: Sprite
    state: brutepack
    layers:
    - state: brutepack
      map: ["base"]
  - type: Stack
    stackType: OH14_Brutepack
    baseLayer: base
    layerStates:
    - brutepack-2
    - brutepack-1
    - brutepack
    count: 8
  - type: Item
    heldPrefix: brutepack
  - type: Healing
    damageContainers:
      - Biological
    damage:
      groups:
        Brute: -15 # 5 for each type in the group
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: StackPrice
    price: 5

