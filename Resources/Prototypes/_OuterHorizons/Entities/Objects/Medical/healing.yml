- type: entity
  name: пакет крови
  description: До недавнего времени Тарра использовали синтетически-синтезированную кровь, однако после инцидента с массовым кровяным отторжением, синтетическая кровь была выведена из эксплуатации.
  parent: OH14_BaseHealingItem
  id: OH14_Bloodpack
  suffix: Full
  components:
  - type: Item
    heldPrefix: bloodpack
  - type: Tag
    tags:
    - Bloodpack
    - OH14_Medicines
  - type: Sprite
    layers:
    - state: bloodpack-liquid-5
      map: ["base"]
    - state: bloodpack-empty
  - type: Healing
    damageContainers:
      - Biological
    damage:
      types:
        Bloodloss: -0.5 #lowers bloodloss damage
    modifyBloodLevel: 15 #restores about 5% blood per use on standard humanoids.
    healingBeginSound:
      path: "/Audio/Items/Medical/brutepack_begin.ogg"
      params:
        volume: 1.0
        variation: 0.125
    healingEndSound:
      path: "/Audio/Items/Medical/brutepack_end.ogg"
      params:
        volume: 1.0
        variation: 0.125
  - type: Stack
    stackType: OH14_Bloodpack
    baseLayer: base
    layerStates:
    - bloodpack-liquid-1
    - bloodpack-liquid-2
    - bloodpack-liquid-3
    - bloodpack-liquid-4
    - bloodpack-liquid-5
    count: 8
  - type: StackPrice
    price: 10

