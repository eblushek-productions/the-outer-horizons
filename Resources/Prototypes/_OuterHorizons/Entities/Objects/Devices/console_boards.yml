- type: entity
  parent: OH14_BaseItem
  id: OH14_BasicCircuitboard
  name: плата
  description: Простецкая зеленая плата для консолей или оборудования.
  abstract: true
  components:
    - type: Tag
      tags:
      - OH14_Tools
    - type: ComputerBoard
    - type: Sprite
      sprite: _OuterHorizons/Objects/Materials/circuitboard.rsi
      state: Board
    - type: StaticPrice
      price: 100
    - type: PhysicalComposition
      materialComposition:
        Glass: 230
      chemicalComposition:
        Silicon: 20
    - type: Circuitboard

