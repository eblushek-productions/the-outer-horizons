- type: constructionGraph
  id: OH14_WallDirectional
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: frame
          steps:
            - material: OH14_Girders
              amount: 1
              doAfter: 2
    - node: frame
      entity: OH14_WallDirectionalFrame
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
                prototype: OH14_SheetGirder1
                amount: 1
          steps:
            - tool: Screwing
              doAfter: 1
        - to: OH14_WallDirectional
          steps:
            - material: OH14_Materials
              amount: 1
              doAfter: 1
    - node: OH14_WallDirectional
      entity: OH14_WallDirectional
      edges:
        - to: frame
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetMaterials1
              amount: 1
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 1
