# ЛКП

- type: constructionGraph
  id: OH14_APC
  start: start
  graph:
    - node: start
      edges:
        - to: apcFrame
          steps:
            - material: OH14_Girders
              amount: 1
              doAfter: 1
    - node: apcFrame
      entity: OH14_FrameAPC
      edges:
        - to: OH14_APC
          steps:
            - tag: OH14_CopperStator
              name: construction-graph-tag-copper-stator
              doAfter: 1
            - tag: OH14_CopperStator
              name: construction-graph-tag-copper-stator
              doAfter: 1
        - to: start
          completed:
            - !type:GivePrototype
              prototype: OH14_SheetGirder1
              amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
    - node: OH14_APC
      entity: OH14_APC_Open
      edges:
        - to: apcFrame
          completed:
            - !type:GivePrototype
              prototype: OH14_CopperStator
              amount: 2
          conditions:
            - !type:WirePanel
              open: true
          steps:
            - tool: Prying
              doAfter: 2

# Подстанции

- type: constructionGraph
  id: OH14_SubstationWallmount
  start: start
  graph:
    - node: start
      edges:
        - to: subFrame
          steps:
            - material: OH14_Girders
              amount: 1
              doAfter: 1
    - node: subFrame
      actions:
      - !type:AppearanceChange
      entity: OH14_SubstationWallFrame
      edges:
        - to: subFrame2
          steps:
            - tag: OH14_CopperStator
              name: construction-graph-tag-copper-stator
              doAfter: 1
            - tag: OH14_CopperStator
              name: construction-graph-tag-copper-stator
              doAfter: 1
            - tag: OH14_CopperStator
              name: construction-graph-tag-copper-stator
              doAfter: 1
            - tag: OH14_CopperStator
              name: construction-graph-tag-copper-stator
              doAfter: 1
        - to: start
          completed:
            - !type:GivePrototype
              prototype: OH14_SheetGirder1
              amount: 1
            - !type:DeleteEntity {}
          steps:
            - tool: Screwing
              doAfter: 2
    - node: subFrame2
      entity: OH14_SubstationWallFrame
      actions:
      - !type:AppearanceChange
      edges:
        - to: OH14_SubstationWallmount
          steps:
            - tag: OH14_AnalogBoardComplete
              name: construction-graph-tag-analogboard
              doAfter: 1
        - to: subFrame
          completed:
            - !type:GivePrototype
              prototype: OH14_CopperStator
              amount: 4
          steps:
            - tool: Screwing
              doAfter: 2
    - node: OH14_SubstationWallmount
      entity: OH14_BaseSubstationWall
      edges:
        - to: subFrame2
          completed:
            - !type:GivePrototype
              prototype: OH14_AnalogBoardComplete
              amount: 1
          conditions:
            - !type:WirePanel
              open: true
          steps:
            - tool: Prying
              doAfter: 2

