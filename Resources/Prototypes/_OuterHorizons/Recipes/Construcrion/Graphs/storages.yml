- type: constructionGraph
  id: OH14_Crate
  start: start
  graph:
    - node: start
      actions:
        - !type:DestroyEntity {}
      edges:
        - to: OH14_Crate
          steps:
            - material: OH14_Materials
              amount: 2
              doAfter: 3
    - node: OH14_Crate
      entity: OH14_Crate
      edges:
        - to: start
          completed:
            - !type:SpawnPrototype
              prototype: OH14_SheetMaterials1
              amount: 2
          steps:
            - tool: Screwing
              doAfter: 2
            - tool: Prying
              doAfter: 1

