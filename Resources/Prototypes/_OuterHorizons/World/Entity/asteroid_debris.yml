- type: entity
  id: OH14_BaseAsteroidDebris
  parent: BaseDebris
  name: asteroid debris
  abstract: true
  components:
    - type: MapGrid
    - type: BlobSmoothFloorPlanBuilder
      floorTileset:
      - OH14_IceMoon
      crustTileset:
      - OH14_IceMoonAlternative
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
      crustLayers: 4
    - type: SimpleFloorPlanPopulator
      entries:
        OH14_IceMoon:
          - id: OH14_BaseWallRock
            prob: 0.42
            orGroup: rock
          - id: OH14_BaseWallIce
            prob: 0.2
            orGroup: rock
          - id: OH14_WallStoneOreIron
            prob: 0.06
            orGroup: rock
          - id: OH14_WallStoneOreCopper
            prob: 0.04
            orGroup: rock
          - id: OH14_WallStoneOreGold
            prob: 0.02
            orGroup: rock
          - id: OH14_WallStoneOrePlatinum
            prob: 0.02
            orGroup: rock
          - id: OH14_WallStoneOreSilicon
            prob: 0.02
            orGroup: rock
          - id: OH14_WallStoneOreCobalt
            prob: 0.02
            orGroup: rock
        OH14_IceMoonAlternative:
          - id: OH14_BaseWallStone
            prob: 0.8
            orGroup: crust_rock
          - id: OH14_WallStoneOreIron
            prob: 0.06
            orGroup: crust_rock
          - id: OH14_WallStoneOreCopper
            prob: 0.06
            orGroup: crust_rock
          - id: OH14_WallStoneOreSilicon
            prob: 0.04
            orGroup: crust_rock
          - id: OH14_WallStoneOreCobalt
            prob: 0.04
            orGroup: crust_rock
    - type: IFF
      flags: HideLabel
      color: "#BDA89A"
    - type: Shuttle
      bodyModifier: 5

- type: entity
  id: OH14_AsteroidDebrisSmall
  parent: OH14_BaseAsteroidDebris
  name: asteroid debris small
  categories: [ HideSpawnMenu ]
  components:
    - type: MapGrid
    - type: BlobSmoothFloorPlanBuilder
      blobDrawProb: 0.66
      radius: 15
      floorPlacements: 50

