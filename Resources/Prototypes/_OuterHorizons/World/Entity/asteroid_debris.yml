- type: entity
  id: OH14_BaseAsteroidDebris
  parent: BaseDebris
  name: asteroid debris
  abstract: true
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      floorTileset:
      - OH14_IceMoon
      blobDrawProb: 0.5
      radius: 6
      floorPlacements: 16
    - type: SimpleFloorPlanPopulator
      entries:
        OH14_IceMoon:
          - id: OH14_BaseWallStone
            prob: 0.5
            orGroup: rock
          - id: OH14_BaseWallStoneOre
            prob: 0.15
            orGroup: rock
    - type: IFF
      flags: HideLabel
      color: "#d49979"
    - type: Shuttle
      bodyModifier: 1

- type: entity
  id: OH14_AsteroidDebrisSmall
  parent: OH14_BaseAsteroidDebris
  name: asteroid debris small
  categories: [ HideSpawnMenu ]
  components:
    - type: MapGrid
    - type: BlobFloorPlanBuilder
      blobDrawProb: 0.66
      radius: 15
      floorPlacements: 50

