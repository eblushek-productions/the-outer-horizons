- type: entity
  parent: BaseSpeciesAppearance
  id: OH14_TarrantokAppearance
  name: внешность Тарра
  components:
  - type: Inventory
    templateId: OH14_Tarrantok
    speciesId: OH14_Tarrantok
    # femaleDisplacements:
    #   jumpsuit:
    #     sizeMaps:
    #       32:
    #         sprite: Mobs/Species/Human/displacement.rsi
    #         state: jumpsuit-female
  - type: InitialBody
    organs:
      Torso: OH14_TarrantokOrganTorso
      Head: OH14_TarrantokOrganHead
      ArmLeft: OH14_TarrantokOrganArmLeft
      ArmRight: OH14_TarrantokOrganArmRight
      HandRight: OH14_TarrantokOrganHandRight
      HandLeft: OH14_TarrantokOrganHandLeft
      LegLeft: OH14_TarrantokOrganLegLeft
      LegRight: OH14_TarrantokOrganLegRight
      FootLeft: OH14_TarrantokOrganFootLeft
      FootRight: OH14_TarrantokOrganFootRight
      Brain: OH14_TarrantokOrganBrain
      Eyes: OH14_TarrantokOrganEyes
      Tongue: OH14_TarrantokOrganTongue
      Appendix: OH14_TarrantokOrganAppendix
      Ears: OH14_TarrantokOrganEars
      Lungs: OH14_TarrantokOrganLungs
      Heart: OH14_TarrantokOrganHeart
      Stomach: OH14_TarrantokOrganStomach
      Liver: OH14_TarrantokOrganLiver
      Kidneys: OH14_TarrantokOrganKidneys
  - type: HumanoidProfile
    species: OH14_Tarrantok
  - type: Sprite
    layers:
    # Torso
    - map: [ "enum.HumanoidVisualLayers.Chest" ]
    # Head
    - map: [ "enum.HumanoidVisualLayers.Eyes" ]
    - map: [ "enum.HumanoidVisualLayers.Head" ]
    - map: [ "enum.HumanoidVisualLayers.Snout" ]
    # Limbs
    - map: [ "enum.HumanoidVisualLayers.RArm" ]
    - map: [ "enum.HumanoidVisualLayers.LArm" ]
    - map: [ "enum.HumanoidVisualLayers.RLeg" ]
    - map: [ "enum.HumanoidVisualLayers.LLeg" ]
    # Underwear
    - map: [ "enum.HumanoidVisualLayers.UndergarmentBottom" ]
    - map: [ "enum.HumanoidVisualLayers.UndergarmentTop" ]
    # Extremities
    - map: ["enum.HumanoidVisualLayers.LFoot"]
    - map: ["enum.HumanoidVisualLayers.RFoot"]
    # Clothing
    - map: ["pants"]
    - map: ["jumpsuit"]
    # Extremities
    - map: ["enum.HumanoidVisualLayers.LHand"]
    - map: ["enum.HumanoidVisualLayers.RHand"]
    # Tail
    - map: [ "enum.HumanoidVisualLayers.Tail" ]
    - map: [ "enum.HumanoidVisualLayers.TailOverlay" ]
    # Stuff that goes over the body but below equipment
    - map: ["enum.HumanoidVisualLayers.Overlay"]
    # More equipment
    - map: [ "gloves" ]
    - map: [ "shoes" ]
    - map: [ "ears" ]
    - map: [ "eyes" ]
    - map: [ "belt" ]
    - map: [ "id" ]
    - map: [ "outerClothing" ]
    - map: [ "back" ]
    - map: [ "neck" ]
    - map: ["tailbag"]
    - map: [ "suitstorage" ]
    # Stuff that goes in front of equipment
    - map: [ "enum.HumanoidVisualLayers.SnoutCover" ]
    - map: [ "enum.HumanoidVisualLayers.FacialHair" ]
    - map: [ "enum.HumanoidVisualLayers.Hair" ]
    - map: [ "enum.HumanoidVisualLayers.HeadSide" ]
    - map: [ "enum.HumanoidVisualLayers.HeadTop" ]
    # Stuff that goes in front of stuff that goes in front of equipment
    - map: [ "mask" ]
    - map: [ "head" ]
    - map: [ "pocket1" ]
    - map: [ "pocket2" ]
    # Extra stuff
    - map: ["enum.HumanoidVisualLayers.Handcuffs"]
      color: "#ffffff"
      sprite: Objects/Misc/handcuffs.rsi
      state: body-overlay-2
      visible: false
    - map: [ "clownedon" ] # Dynamically generated
      sprite: "Effects/creampie.rsi"
      state: "creampie_human"
      visible: false
  - type: DamageVisuals
    thresholds: [ 15, 30, 45, 60, 75 ]
    targetLayers:
    - "enum.HumanoidVisualLayers.Overlay"
    damageOverlayGroups:
      Brute:
        sprite: _OuterHorizons/Mobs/Effects/brute_damage.rsi
        # color: "#FF0000"
      Burn:
        sprite: _OuterHorizons/Mobs/Effects/burn_damage.rsi

